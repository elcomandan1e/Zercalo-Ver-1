/* === v2.1.3: подсветка и фацет на чертежах === */

function _backlightSides(b){

  var s={top:false,right:false,bottom:false,left:false};

  if(!Array.isArray(b)||!b.length)return s;

  for(var i=0;i<b.length;i++){

    var v=b[i];

    if(v==='По периметру'){s.top=s.right=s.bottom=s.left=true;}

    else if(v==='По 3 сторонам (сверху и по бокам)'){s.top=s.left=s.right=true;}

    else if(v==='По 3 сторонам (снизу и по бокам)'){s.bottom=s.left=s.right=true;}

    else if(v==='По 2 вертикальным сторонам'){s.left=s.right=true;}

    else if(v==='По 2 горизонтальным сторонам'){s.top=s.bottom=true;}

    else if(v==='По левой стороне'){s.left=true;}

    else if(v==='По правой стороне'){s.right=true;}

    else if(v==='Снизу'){s.bottom=true;}

    else if(v==='Сверху'){s.top=true;}

  }

  return s;

}

function _backlightHasMode(b,mode){if(!Array.isArray(b))return false;return b.indexOf(mode)>=0;}

function _drawMirrorBacklightRays(ctx,x,y,w,h,d,scale){

  if(!d||d.type!=='MIRROR')return;

  var b=backlightArr(d);

  if(!_backlightHasMode(b,'Из-за зеркала'))return;

  var sides=_backlightSides(b);

  if(!(sides.top||sides.right||sides.bottom||sides.left)){sides.top=sides.right=sides.bottom=sides.left=true;}

  ctx.save();

  ctx.strokeStyle='rgba(232,167,12,0.85)';

  ctx.lineWidth=1.2;

  var step=Math.max(5,Math.min(w,h)/14);

  var rayLen=Math.max(10,Math.min(w,h)*0.10);

  function rays(side){

    ctx.beginPath();

    if(side==='top'){for(var px=x+step/2;px<x+w-1;px+=step){ctx.moveTo(px,y);ctx.lineTo(px-3,y-rayLen);}}

    else if(side==='bottom'){for(var px=x+step/2;px<x+w-1;px+=step){ctx.moveTo(px,y+h);ctx.lineTo(px+3,y+h+rayLen);}}

    else if(side==='left'){for(var py=y+step/2;py<y+h-1;py+=step){ctx.moveTo(x,py);ctx.lineTo(x-rayLen,py-3);}}

    else if(side==='right'){for(var py=y+step/2;py<y+h-1;py+=step){ctx.moveTo(x+w,py);ctx.lineTo(x+w+rayLen,py+3);}}

    ctx.stroke();

  }

  if(sides.top)rays('top');

  if(sides.bottom)rays('bottom');

  if(sides.left)rays('left');

  if(sides.right)rays('right');

  ctx.restore();

}

function _drawMirrorBacklightStrip(ctx,x,y,w,h,d,scale){

  if(!d||d.type!=='MIRROR')return;

  var b=backlightArr(d);

  if(!_backlightHasMode(b,'На зеркале'))return;

  var sides=_backlightSides(b);

  if(!(sides.top||sides.right||sides.bottom||sides.left)){sides.top=sides.right=sides.bottom=sides.left=true;}

  var offPx=(Number(d.backlightOffset)||2)*scale;

  var widPx=(Number(d.backlightWidth)||2)*scale;

  if(widPx<=0||offPx<0)return;

  ctx.save();

  ctx.fillStyle='rgba(120,140,160,0.30)';

  ctx.strokeStyle='rgba(90,110,130,0.60)';

  ctx.lineWidth=0.8;

  function strip(side){

    var sx,sy,sw,sh;

    if(side==='top'){sx=x+offPx;sy=y+offPx;sw=w-2*offPx;sh=widPx;}

    else if(side==='bottom'){sx=x+offPx;sy=y+h-offPx-widPx;sw=w-2*offPx;sh=widPx;}

    else if(side==='left'){sx=x+offPx;sy=y+offPx;sw=widPx;sh=h-2*offPx;}

    else if(side==='right'){sx=x+w-offPx-widPx;sy=y+offPx;sw=widPx;sh=h-2*offPx;}

    else return;

    if(sw<=0||sh<=0)return;

    ctx.beginPath();ctx.rect(sx,sy,sw,sh);ctx.fill();ctx.stroke();

    /* Мелкие вертикальные штрихи — имитация матовки. */

    ctx.save();

    ctx.beginPath();ctx.rect(sx,sy,sw,sh);ctx.clip();

    ctx.strokeStyle='rgba(90,110,130,0.30)';

    ctx.lineWidth=0.6;

    ctx.beginPath();

    var dirStep=5;

    if(side==='top'||side==='bottom'){for(var px=sx+2;px<sx+sw;px+=dirStep){ctx.moveTo(px,sy);ctx.lineTo(px,sy+sh);}}

    else{for(var py=sy+2;py<sy+sh;py+=dirStep){ctx.moveTo(sx,py);ctx.lineTo(sx+sw,py);}}

    ctx.stroke();

    ctx.restore();

  }

  if(sides.top)strip('top');

  if(sides.bottom)strip('bottom');

  if(sides.left)strip('left');

  if(sides.right)strip('right');

  ctx.restore();

}

function _drawMirrorFacet(ctx,x,y,w,h,d,scale){

  if(!d||d.type!=='MIRROR')return;

  if(d.edge!=='Фацет')return;

  var fwMm=Number(d.facetWidth)||0;

  if(fwMm<=0)return;

  var fwPx=fwMm/10*scale;

  if(fwPx<=0)return;

  var maxW=w/2-1,maxH=h/2-1;

  if(fwPx>maxW)fwPx=maxW;

  if(fwPx>maxH)fwPx=maxH;

  ctx.save();

  ctx.strokeStyle='rgba(200,90,30,0.90)';

  ctx.lineWidth=1.4;

  ctx.setLineDash([4,3]);

  ctx.beginPath();ctx.rect(x+fwPx,y+fwPx,w-2*fwPx,h-2*fwPx);ctx.stroke();

  ctx.setLineDash([]);

  ctx.strokeStyle='rgba(200,90,30,0.55)';

  ctx.lineWidth=0.9;

  var cs=Math.min(fwPx*1.6,Math.min(w,h)*0.15);

  ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x+cs,y+cs);

  ctx.moveTo(x+w,y);ctx.lineTo(x+w-cs,y+cs);

  ctx.moveTo(x,y+h);ctx.lineTo(x+cs,y+h-cs);

  ctx.moveTo(x+w,y+h);ctx.lineTo(x+w-cs,y+h-cs);

  ctx.stroke();

  ctx.fillStyle='#c85a1e';

  ctx.font='700 11px "PT Sans Narrow",Arial';

  ctx.textAlign='left';ctx.textBaseline='bottom';

  ctx.fillText('Фацет '+numFmt(fwMm)+' мм',x+fwPx+3,y+fwPx-2);

  ctx.restore();

}

function _backlightFacetLegend(d){

  if(!d||d.type!=='MIRROR')return '';

  var parts=[];

  var b=backlightArr(d);

  if(_backlightHasMode(b,'Из-за зеркала'))parts.push('💡 из-за зеркала');

  if(_backlightHasMode(b,'На зеркале'))parts.push('💡 на зеркале');

  if(d.edge==='Фацет'&&Number(d.facetWidth)>0)parts.push('✂️ фацет '+numFmt(d.facetWidth)+' мм');

  return parts.join(' • ');

}

/* === v2.1.8: CAD-хелперы для проф. чертежа зеркала === */

function _roundRectPath(ctx,x,y,w,h,r){

  r=Math.min(Number(r)||0,w/2,h/2);

  ctx.moveTo(x+r,y);

  ctx.arcTo(x+w,y,x+w,y+h,r);

  ctx.arcTo(x+w,y+h,x,y+h,r);

  ctx.arcTo(x,y+h,x,y,r);

  ctx.arcTo(x,y,x+w,y,r);

  ctx.closePath();

}

function _drawHatchBand(ctx,x,y,w,h,rOuter,bandInset,bandWidth){

  if(bandWidth<=0)return;

  var bw=bandInset+bandWidth;

  if(bw*2>=w||bw*2>=h)return;

  var iw=w-2*bw,ih=h-2*bw;

  var rIn=Math.max(0,(rOuter||0)-bw);

  ctx.save();

  ctx.beginPath();

  _roundRectPath(ctx,x,y,w,h,rOuter||0);

  _roundRectPath(ctx,x+bw,y+bw,iw,ih,rIn);

  ctx.clip('evenodd');

  ctx.strokeStyle='rgba(140,110,70,0.65)';

  ctx.lineWidth=0.9;

  var step=4.5;

  ctx.beginPath();

  for(var i=-h;i<w+h;i+=step){

    ctx.moveTo(x+i,y);

    ctx.lineTo(x+i+h,y+h);

  }

  ctx.stroke();

  ctx.strokeStyle='rgba(100,80,50,0.9)';

  ctx.lineWidth=0.8;

  ctx.setLineDash([3,2]);

  ctx.beginPath();

  _roundRectPath(ctx,x+bw,y+bw,iw,ih,rIn);

  ctx.stroke();

  ctx.setLineDash([]);

  ctx.restore();

}

function _dimH(ctx,x1,x2,y,text){

  var col='#c14d4d';

  ctx.save();

  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(x1,y-6);ctx.lineTo(x1,y+6);

  ctx.moveTo(x2,y-6);ctx.lineTo(x2,y+6);

var _galleryState={srcs:[],index:0};

function openPhotoGallery(srcs,startIndex){

  if(!Array.isArray(srcs)||!srcs.length)return;

  _galleryState.srcs=srcs.slice();

  _galleryState.index=Math.max(0,Math.min(srcs.length-1,parseInt(startIndex,10)||0));

function renderPhotoGalleryOverlay(){

  var st=_galleryState;

  var html='<div class="gallery-overlay" id="galleryOverlay">';

  html+='<div class="gallery-track" id="galleryTrack" style="transform:translateX(-'+(st.index*100)+'%)">';

  st.srcs.forEach(function(s){html+='<div class="gallery-slide"><img src="'+s+'" onclick="event.stopPropagation()"></div>';});

  html+='</div>';

  html+='<div class="gallery-counter" id="galleryCounter">'+(st.index+1)+' / '+st.srcs.length+'</div>';

  if(st.srcs.length>1){

    html+='<button class="gallery-nav prev" id="galPrev">‹</button>';

    html+='<button class="gallery-nav next" id="galNext">›</button>';

  }

  html+='<button class="gallery-close" onclick="closePhotoGallery()">✕</button>';

  html+='</div>';

  document.body.insertAdjacentHTML('beforeend',html);

  var overlay=document.getElementById('galleryOverlay');

  var track=document.getElementById('galleryTrack');

  var prevBtn=document.getElementById('galPrev');

  var nextBtn=document.getElementById('galNext');

  function setIndex(i){

    st.index=Math.max(0,Math.min(st.srcs.length-1,i));

    track.style.transform='translateX(-'+(st.index*100)+'%)';

    var c=document.getElementById('galleryCounter');if(c)c.textContent=(st.index+1)+' / '+st.srcs.length;

  }

  if(prevBtn)prevBtn.onclick=function(e){e.stopPropagation();setIndex(st.index-1);};

  if(nextBtn)nextBtn.onclick=function(e){e.stopPropagation();setIndex(st.index+1);};

  /* Свайп touch. */

  var startX=0,startY=0,dx=0,dragging=false,locked=null;

  overlay.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];startX=t.clientX;startY=t.clientY;dx=0;dragging=true;locked=null;track.style.transition='none';},{passive:true});

  overlay.addEventListener('touchcancel',endSwipe);

  /* Клик по пустому месту — закрыть. */

  overlay.addEventListener('click',function(e){if(e.target===overlay)closePhotoGallery();});

  /* Клавиатура. */

  function onKey(e){

    if(e.key==='Escape')closePhotoGallery();

    else if(e.key==='ArrowLeft')setIndex(st.index-1);

    else if(e.key==='ArrowRight')setIndex(st.index+1);

  }

  window._galleryKeyHandler=onKey;

  window.addEventListener('keydown',onKey);

}

  if(window._galleryKeyHandler){window.removeEventListener('keydown',window._galleryKeyHandler);window._galleryKeyHandler=null;}

function updateNotifBadge(){

function renderHomeDashboard(){

  var u=currentUser();

  if(!u)return '';

  var today=dateToYmd(new Date());

  var now=new Date();

  var h=now.getHours();

  var greet=h<6?'Доброй ночи':(h<12?'Доброе утро':(h<18?'Добрый день':'Добрый вечер'));

  var firstName=(u.name||'').split(' ')[0]||u.name||'коллега';

  var dateLabel=pad2(now.getDate())+' '+monthNameRuGen(now.getMonth());

  var html='<div class="card no-tap" style="padding:18px 20px 16px;background:linear-gradient(135deg,rgba(123,157,209,0.14),rgba(91,127,184,0.06));border:1.5px solid var(--accent-line)">';

  html+='<div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:700">'+esc(dateLabel)+'</div>';

  html+='<div style="font-size:20px;font-weight:800;color:var(--text);margin-top:2px">'+esc(greet)+', '+esc(firstName)+'!</div>';

  html+='</div>';

  var isRazj=(u.role==='driver'||u.role==='surveyor');

  var isMaster=(u.role==='master');

  if(isRazj){

    var myRoutes=db.routes.filter(function(r){return r.date===today&&r.assignedUserId===u.id;});

    var myEvs=db.events.filter(function(e){return e.date===today&&Array.isArray(e.assignedUserIds)&&e.assignedUserIds.indexOf(u.id)>=0;});

    myEvs.sort(function(a,b){var am=parseTimeToMinutes(a.time),bm=parseTimeToMinutes(b.time);if(am==null&&bm==null)return 0;if(am==null)return 1;if(bm==null)return -1;return am-bm;});

    if(myRoutes.length){

      var r0=myRoutes[0];var pts=r0.points||[];var firstP=pts[0];var firstLbl='';

      if(firstP){

        if(firstP.kind==='order'&&firstP.refId){var oo=db.orders.find(function(x){return x.id===firstP.refId;});if(oo)firstLbl='№'+(oo.orderNum||'')+' • '+(orderClientName(oo)||'');}

        else if(firstP.kind==='contractor'&&firstP.refId){var cc=contractorById(firstP.refId);if(cc)firstLbl=cc.name||'';}

        else firstLbl=firstP.label||'';

      }

      html+='<div class="card no-tap" style="padding:16px 20px;background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;margin-top:12px" onclick="openRoute('+r0.id+')">';

      html+='<div style="font-size:12px;opacity:0.85;text-transform:uppercase;letter-spacing:0.5px;font-weight:700">🚚 Мой маршрут на сегодня</div>';

      html+='<div style="font-size:17px;font-weight:800;margin-top:4px">'+esc(r0.title||'Маршрут')+'</div>';

      var routeMin=0;

      pts.forEach(function(p){if(p.legFromPrev&&Number(p.legFromPrev.minutes))routeMin+=Number(p.legFromPrev.minutes);});

      routeMin+=pts.length*15;

      var evsForDay=dayWorkload(today);

      var myEvMin=evsForDay[u.id]?evsForDay[u.id].events:0;

      var totalMin=routeMin+myEvMin;

      html+='<div style="font-size:13px;opacity:0.9;margin-top:6px">Точек: '+pts.length+(firstLbl?' • Первая: '+esc(firstLbl):'')+'</div>';

      if(totalMin>0)html+='<div style="font-size:13px;font-weight:700;margin-top:6px">⏱ Загрузка ~'+formatDurationMin(totalMin)+'</div>';

      html+='<div style="font-size:12px;opacity:0.85;margin-top:8px">Тапни, чтобы открыть →</div>';

      html+='</div>';

    }

    if(myEvs.length){

      html+='<div class="section-title" style="margin-top:16px">📅 Мои события сегодня</div>';

      myEvs.slice(0,5).forEach(function(e){html+=renderEventCard(e);});

    }

    if(!myRoutes.length&&!myEvs.length){

      html+='<div class="empty-cta" style="margin-top:12px"><span class="ec-ico">☕️</span><div class="ec-title">На сегодня ничего не назначено</div><div class="ec-sub">Хорошего дня!</div></div>';

    }

  } else if(isMaster){

    var workOrders=visibleOrders().filter(function(o){return o.status==='work';});

    var myEvs2=db.events.filter(function(e){return e.date===today&&Array.isArray(e.assignedUserIds)&&e.assignedUserIds.indexOf(u.id)>=0;});

    html+='<div class="section-title" style="margin-top:16px">🔧 В работе ('+workOrders.length+')</div>';

    if(workOrders.length){

      workOrders.slice(0,5).forEach(function(o){

        var items=itemsOf(o.id);

        html+='<div class="card" onclick="openOrder('+o.id+')" style="padding:12px 16px"><div class="card-title" style="font-size:15px">'+(o.orderNum?'<span class="order-num">'+esc(o.orderNum)+'</span>':'')+esc(orderClientName(o)||'Без имени')+'</div><div class="card-sub">Позиций: '+items.length+'</div></div>';

      });

    } else html+='<div class="empty" style="padding:20px;font-size:13px">Пока пусто</div>';

    if(myEvs2.length){

      html+='<div class="section-title" style="margin-top:16px">📅 Мои события сегодня</div>';

      myEvs2.slice(0,5).forEach(function(e){html+=renderEventCard(e);});

    }

  } else {

    var newOrders=visibleOrders().filter(function(o){return (Date.now()-(o.createdAt||0))<24*3600*1000;});

    var unpaidOrders=visibleOrders().filter(function(o){return !o.paid&&o.status!=='cancelled';});

    var todayEvs=db.events.filter(function(e){return e.date===today;});

    html+='<div class="report-kpi" style="margin-top:12px">';

    html+='<div class="report-kpi-cell"><div class="num">'+newOrders.length+'</div><div class="lbl">Новых за 24ч</div></div>';

    html+='<div class="report-kpi-cell"><div class="num">'+todayEvs.length+'</div><div class="lbl">Событий сегодня</div></div>';

    html+='<div class="report-kpi-cell" style="grid-column:1/-1"><div class="num">'+unpaidOrders.length+'</div><div class="lbl">Не оплачено</div></div>';

    html+='</div>';

    if(todayEvs.length){

      html+='<div class="section-title" style="margin-top:8px">📅 События сегодня</div>';

      todayEvs.slice(0,5).forEach(function(e){html+=renderEventCard(e);});

    }

  }

  if(canCreateOrder())html+='<button type="button" class="btn-row-action" onclick="openNewOrder()" style="margin-top:16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span>Новый заказ</span></button>';

  return html;

}

function renderOrderList(){

  var list=visibleOrders().slice();

  /* Фильтры (ЭТАП 2). */

  if(orderFilters.status)list=list.filter(function(o){return o.status===orderFilters.status;});

  if(orderFilters.dateFrom)list=list.filter(function(o){return orderDateKey(o)>=orderFilters.dateFrom;});

  if(orderFilters.dateTo)list=list.filter(function(o){return orderDateKey(o)<=orderFilters.dateTo;});

  if(orderFilters.team){var tid=parseInt(orderFilters.team,10);list=list.filter(function(o){return Array.isArray(o.assignedUserIds)&&o.assignedUserIds.indexOf(tid)>=0;});}

  if(orderFilters.paid==='yes')list=list.filter(function(o){return !!o.paid;});

  if(orderFilters.paid==='no')list=list.filter(function(o){return !o.paid;});

  if(orderFilters.type)list=list.filter(function(o){return itemsOf(o.id).some(function(i){return i.type===orderFilters.type;});});

  if(sortMode==='date-asc')list.sort(function(a,b){return a.createdAt-b.createdAt;});

  else if(sortMode==='name')list.sort(function(a,b){return (orderClientName(a)||'').localeCompare(orderClientName(b)||'','ru');});

  else if(sortMode==='num')list.sort(function(a,b){return (a.orderNum||'').localeCompare(b.orderNum||'','ru',{numeric:true});});

  else if(sortMode==='status'){var ord={new:0,work:1,ready:2,installed:3,cancelled:4};list.sort(function(a,b){return (ord[a.status]||0)-(ord[b.status]||0)||(b.createdAt-a.createdAt);});}

  else list.sort(function(a,b){return b.createdAt-a.createdAt;});

  var q=(searchQ||'').trim().toLowerCase();

  if(q)list=list.filter(function(o){var s=(orderClientName(o)+' '+(o.orderNum||'')+' '+orderAddressShort(o)+' '+orderAddressFull(o)+' '+orderClientPhone(o)).toLowerCase();return s.indexOf(q)>=0;});

  if(!list.length)return '<div class="empty">Ничего не найдено'+(orderFiltersCount()?'<br><br>Попробуйте сбросить фильтры.':'')+'</div>';

  return list.map(renderOrderCard).join('');

}

function setupSwipe(wrap){

  if(!wrap||wrap.dataset.swipeReady)return;wrap.dataset.swipeReady='1';

  var card=wrap.querySelector('.card');if(!card)return;

  var startX=0,startY=0,dx=0,dragging=false,locked=null,threshold=70;

  var canDel=wrap.querySelector('.swipe-actions.right').textContent.indexOf('Удалить')>=0;

  function onStart(e){if(e.target.closest('.tap-link,.del-x'))return;var t=e.touches?e.touches[0]:e;startX=t.clientX;startY=t.clientY;dx=0;dragging=true;locked=null;card.style.transition='none';}

  function onMove(e){if(!dragging)return;var t=e.touches?e.touches[0]:e;var cx=t.clientX-startX,cy=t.clientY-startY;if(locked===null){if(Math.abs(cx)>Math.abs(cy)+6)locked='x';else if(Math.abs(cy)>Math.abs(cx)+6){locked='y';dragging=false;return;}else return;}if(locked==='x'){e.preventDefault();dx=cx;if(dx>0&&!canDel)dx=0;card.style.transform='translateX('+dx+'px)';}}

  function onEnd(){if(!dragging)return;dragging=false;card.style.transition='transform .22s cubic-bezier(.4,0,.2,1)';if(dx<=-threshold&&canDel){card.style.transform='translateX(-100%)';var oid=parseInt(wrap.dataset.oid);setTimeout(function(){deleteOrderQuick(oid);},200);}else if(dx>=threshold){card.style.transform='translateX(0)';var oid2=parseInt(wrap.dataset.oid);openOrder(oid2);setTimeout(function(){shareCurrentOrder();},300);}else card.style.transform='translateX(0)';dx=0;}

  card.addEventListener('touchstart',onStart,{passive:true});card.addEventListener('touchmove',onMove,{passive:false});card.addEventListener('touchend',onEnd);

  card.addEventListener('mousedown',onStart);card.addEventListener('mousemove',onMove);card.addEventListener('mouseup',onEnd);card.addEventListener('mouseleave',function(){if(dragging)onEnd();});

}

/* Утилита: удалить все уведомления, привязанные к заказу/событию/маршруту. */

function purgeNotificationsForOrder(orderId){

  if(!orderId)return;

  db.notifications=db.notifications.filter(function(n){return n.linkOrderId!==orderId;});

}

function purgeNotificationsForEvent(eventId){

  if(!eventId)return;

  db.notifications=db.notifications.filter(function(n){return n.linkEventId!==eventId;});

}

function purgeNotificationsForRoute(routeId){

  if(!routeId)return;

  db.notifications=db.notifications.filter(function(n){return n.linkRouteId!==routeId;});

}

async function deleteOrderQuick(id){var o=db.orders.find(function(x){return x.id===id;});if(!o)return;if(!canDeleteOrder(o)){uiAlert('Нет прав');return;}var items=db.items.filter(function(i){return i.orderId===id;});db.trash.push({type:'order',deletedAt:Date.now(),deletedBy:db.currentUserId,order:JSON.parse(JSON.stringify(o)),items:items.map(function(i){return JSON.parse(JSON.stringify(i));})});var dk=orderDateKey(o);db.orders=db.orders.filter(function(x){return x.id!==id;});db.items=db.items.filter(function(i){return i.orderId!==id;});purgeNotificationsForOrder(id);var evsToPurge=db.events.filter(function(e){return e.orderId===id;});evsToPurge.forEach(function(e){purgeNotificationsForEvent(e.id);});if(dk)renumberDayOrders(dk);haptic(20);save();render();showUndo('Заказ № '+(o.orderNum||'—')+' в корзине',function(){var t=db.trash[db.trash.length-1];if(t)restoreTrashEntry(t);},7000);}

async function deleteItem(id){var it=db.items.find(function(x){return x.id===id;});if(!it)return;var o=db.orders.find(function(x){return x.id===it.orderId;});if(o&&!canEditOrder(o)){uiAlert('Нет прав');return;}db.trash.push({type:'item',deletedAt:Date.now(),deletedBy:db.currentUserId,item:JSON.parse(JSON.stringify(it))});db.items=db.items.filter(function(x){return x.id!==id;});haptic(20);save();render();showUndo('Позиция в корзине',function(){var t=db.trash[db.trash.length-1];if(t)restoreTrashEntry(t);},7000);}

function restoreTrashEntry(entry){var idx=db.trash.indexOf(entry);if(idx<0)return;if(entry.type==='order'){db.orders.push(entry.order);(entry.items||[]).forEach(function(i){db.items.push(i);});var days={};days[orderDateKey(entry.order)]=1;Object.keys(days).forEach(function(k){if(k)renumberDayOrders(k);});}else if(entry.type==='item')db.items.push(entry.item);db.trash.splice(idx,1);haptic(8);save();render();}

async function duplicateItem(id){var it=db.items.find(function(x){return x.id===id;});if(!it)return;var o=db.orders.find(function(x){return x.id===it.orderId;});if(!o||!canEditOrder(o)){uiAlert('Нет прав');return;}var copy=JSON.parse(JSON.stringify(it));copy.id=db.nextItem++;delete copy.drawingIsoId;delete copy.drawingFrontId;ensureUpdatedAt(copy,Date.now());db.items.push(copy);haptic([15,40,15]);save();render();uiAlert('Позиция скопирована');}

    if(!c){activeTab='clients';clientsView='list';currentClientId=null;try{history.replaceState({view:'list'},'','#');}catch(_){}render();window.scrollTo(0,0);return;}

    activeTab='clients';clientsView='detail';currentClientId=st.clientId;

    withViewTransition(function(){render();window.scrollTo(0,0);});

    return;

  }

  if(activeTab!=='orders'&&!(st.view==='detail'&&st.orderId)){activeTab='orders';withViewTransition(function(){render();window.scrollTo(0,0);});return;}

  if(st.view==='detail'&&st.orderId){

  if(!list.length){

  }else{

    html+='<div style="max-height:44vh;overflow-y:auto;padding-right:4px">'+list.map(function(c){

      var ordCount=ordersOfClient(c.id).length;

      var sub=[];

      else sub.push('адресов нет');

      if(ordCount)sub.push('заказов: '+ordCount);

      return '<div class="wz-pick-item'+(sel===c.id?' active':'')+'" onclick="wzPickClient('+c.id+')">'+

    var ev={id:evId,type:'measure',orderId:id,date:s.eventDate,time:s.eventTime||'',duration:0,assignedUserIds:s.team.slice(),note:'Замер по заказу № '+base,status:'planned',createdAt:Date.now(),createdBy:db.currentUserId,updatedAt:Date.now()};

function payRecalc(){

  var t=parseFloat(String((document.getElementById('pay_total')||{}).value||'').replace(',','.'))||0;

  var p=parseFloat(String((document.getElementById('pay_paid')||{}).value||'').replace(',','.'))||0;

  var due=Math.max(0,t-p);

  var fully=(t>0&&due<=0);

  var tv=document.getElementById('pay_t_view');if(tv)tv.textContent=(t?numFmt(t)+' ₽':'—');

  var pv=document.getElementById('pay_p_view');if(pv)pv.textContent=(p?numFmt(p)+' ₽':'0 ₽');

  var blk=document.getElementById('pay_view_block');

  if(blk)blk.classList.toggle('paid-full',fully);

  var dv=document.getElementById('pay_due_view');

  if(dv){

    if(fully)dv.innerHTML='<span>✓ Полностью оплачен</span><span>0 ₽</span>';

    else dv.innerHTML='<span>💰 К доплате</span><span>'+(t>0?numFmt(due)+' ₽':'—')+'</span>';

  }

}

function payQuickFull(){

  var tEl=document.getElementById('pay_total'),pEl=document.getElementById('pay_paid');

  if(!tEl||!pEl)return;

  var t=parseFloat(String(tEl.value||'').replace(',','.'))||0;

  pEl.value=t?numFmt(t):'';

  payRecalc();

}

function payQuickZero(){

  var pEl=document.getElementById('pay_paid');if(pEl)pEl.value='';

  payRecalc();

}

function payQuickEst(est){

  var tEl=document.getElementById('pay_total');if(tEl)tEl.value=numFmt(est);

}

    evs.sort(function(a,b){

      if(c!==0)return c;

          '<div class="cal-ev-date">'+esc(dateStr)+(e.time?(' • '+esc(e.time)):'')+(_est>0?(' • ⏱ '+esc(formatDurationMin(_est))):'')+'</div>'+

          '<div class="cal-ev-title">'+esc(eventTypeLabel(e.type||'measure'))+'</div>'+

          (e.note?'<div class="cal-ev-sub">'+esc(e.note)+'</div>':'')+

  html+='</div>';

  return html;

function renderClientsList(){

  var list=db.clients.slice();

  if(!clientsShowArchived)list=list.filter(function(c){return !c.archived;});

  if(clientsSortMode==='name')list.sort(function(a,b){return (clientFullName(a)||'').localeCompare(clientFullName(b)||'','ru');});

  else if(clientsSortMode==='created-desc')list.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});

  else if(clientsSortMode==='created-asc')list.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});

  else if(clientsSortMode==='orders')list.sort(function(a,b){return ordersOfClient(b.id).length-ordersOfClient(a.id).length;});

  var q=(clientsSearchQ||'').trim().toLowerCase();

  if(q)list=list.filter(function(c){

    var addrArr=addressesOfClient(c.id).map(function(a){return addressShort(a)+' '+addressFull(a);}).join(' ');

    var s=(clientFullName(c)+' '+(c.phone||'')+' '+(c.phoneExtra||'')+' '+(c.email||'')+' '+addrArr).toLowerCase();

    return s.indexOf(q)>=0;

  });

  return list.map(renderClientCard).join('');

  var nm=clientFullName(c)||'Без имени';

  var ordCount=ordersOfClient(c.id).length;

  var addrCount=addressesOfClient(c.id).length;

    '<button class="btn btn-secondary" onclick="closeModal()">Отмена</button>');

  /* Живая проверка дубликатов по телефону/ФИО. */

  function checkDup(){

    var last=(document.getElementById('cf_last').value||'').trim();

    var first=(document.getElementById('cf_first').value||'').trim();

    var phone=(document.getElementById('cf_phone').value||'').trim();

    var box=document.getElementById('cf_dup_warning');

    if(!box)return;

    var dups=[];

    var dPhone=phoneDigits(phone);

    db.clients.forEach(function(cc){

      if(cc.archived)return;

      if(c&&cc.id===c.id)return;

      var samePhone=dPhone&&(phoneDigits(cc.phone)===dPhone||phoneDigits(cc.phoneExtra)===dPhone);

      var sameName=last&&first&&String(cc.lastName||'').trim().toLowerCase()===last.toLowerCase()&&String(cc.firstName||'').trim().toLowerCase()===first.toLowerCase();

      if(samePhone||sameName)dups.push({c:cc,reason:samePhone?'телефон':'ФИО'});

    });

    if(!dups.length){box.innerHTML='';return;}

    var html='<div class="dup-warning">⚠️ Возможные дубликаты:<br>';

    dups.slice(0,5).forEach(function(d){html+='<div class="dup-line" onclick="openClientFromModal('+d.c.id+')"><div><div class="dup-name">'+esc(clientFullName(d.c)||'Без имени')+'</div><div class="dup-info">'+esc(d.reason)+(d.c.phone?(' • '+formatPhone(d.c.phone)):'')+'</div></div><span>→</span></div>';});

    html+='</div>';

    box.innerHTML=html;

  }

  ['cf_last','cf_first','cf_phone'].forEach(function(id2){var el=document.getElementById(id2);if(el)el.addEventListener('input',checkDup);});

}

async function deleteClient(id){

  var c=clientById(id);if(!c)return;

  var ords=ordersOfClient(id);

  if(ords.length){uiAlert('У клиента есть заказы ('+ords.length+'). Удаление запрещено — используйте архив.');return;}

function calPrevMonth(){var m=calState.month-1,y=calState.year;if(m<0){m=11;y--;}calState.month=m;calState.year=y;render();}

function calNextMonth(){var m=calState.month+1,y=calState.year;if(m>11){m=0;y++;}calState.month=m;calState.year=y;render();}

function calSetView(v){calState.view=(v==='list')?'list':'month';render();}

function calSetFilter(f){calState.filter=f||'all';render();}

function calGoToday(){var d=new Date();calState.year=d.getFullYear();calState.month=d.getMonth();render();}

function visibleEvents(){

  var u=currentUser();if(!u)return [];

  var base=db.events.slice();

  if(userCan('events.viewAll'))return base;

  if(userCan('events.viewOwn'))return base.filter(function(e){

    if(Array.isArray(e.assignedUserIds)&&e.assignedUserIds.indexOf(u.id)>=0)return true;

    return false;

  });

  return base.filter(function(e){

    if(Array.isArray(e.assignedUserIds)&&e.assignedUserIds.indexOf(u.id)>=0)return true;

    return false;

  });

}

function filteredEvents(){

  var evs=visibleEvents();

  var f=calState.filter;

  if(f==='measure')evs=evs.filter(function(e){var t=e.type||'measure';return t==='measure'||t==='remeasure';});

  else if(f==='install')evs=evs.filter(function(e){return e.type==='install';});

  else if(f==='mine'){var u=currentUser();if(u)evs=evs.filter(function(e){return Array.isArray(e.assignedUserIds)&&e.assignedUserIds.indexOf(u.id)>=0;});}

  return evs;

}

function renderCalendarMonthGrid(){

  var y=calState.year,m=calState.month;

  var first=firstWeekdayOfMonth(y,m);

  var dim=daysInMonth(y,m);

  var prevM=m===0?11:m-1,prevY=m===0?y-1:y;

  var nextM=m===11?0:m+1,nextY=m===11?y+1:y;

  var prevDim=daysInMonth(prevY,prevM);

  var evs=filteredEvents();

  var byDate={};

  evs.forEach(function(e){if(e.date){(byDate[e.date]=byDate[e.date]||[]).push(e);}});

  var todayYmd=dateToYmd(new Date());

  var cells=[];

  for(var i=0;i<42;i++){

    var dayNum,dateYmd,isDim;

    if(i<first){

      dayNum=prevDim-first+i+1;

      dateYmd=prevY+'-'+pad2(prevM+1)+'-'+pad2(dayNum);

      isDim=true;

    }else if(i<first+dim){

      dayNum=i-first+1;

      dateYmd=y+'-'+pad2(m+1)+'-'+pad2(dayNum);

      isDim=false;

    }else{

      dayNum=i-first-dim+1;

      dateYmd=nextY+'-'+pad2(nextM+1)+'-'+pad2(dayNum);

      isDim=true;

    }

    var dayEvs=byDate[dateYmd]||[];

    var typesSet={};

    dayEvs.forEach(function(e){typesSet[e.type||'measure']=1;});

    var cls='cal-day'+(isDim?' dim':'')+(dateYmd===todayYmd?' today':'')+(dayEvs.length?' has-events':'');

    var dots='<div class="cal-dots">';

    EVENT_TYPES.forEach(function(et){if(typesSet[et.key])dots+='<span class="cal-dot" style="background:'+et.color+'"></span>';});

    dots+='</div>';

    cells.push('<div class="'+cls+'" onclick="openDayModal(\''+dateYmd+'\')"><div class="cal-num">'+dayNum+'</div>'+dots+'</div>');

  }

  var html='<div class="cal-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>';

  html+='<div class="cal-grid">'+cells.join('')+'</div>';

  html+='<div class="cal-hint">Тап на день — события дня</div>';

  return html;

}

function renderCalendarList(){

  var evs=filteredEvents().slice();

  evs=evs.filter(function(e){return !!e.date;});

  evs.sort(function(a,b){

    var c=String(a.date||'').localeCompare(String(b.date||''));

    if(c!==0)return c;

    var am=parseTimeToMinutes(a.time),bm=parseTimeToMinutes(b.time);

    if(am==null&&bm==null)return 0;

    if(am==null)return 1;

    if(bm==null)return -1;

    return am-bm;

  });

  if(!evs.length)return '<div class="empty">В календаре пока пусто.<br><br>Нажмите «+ Событие», чтобы добавить.</div>';

  var groups={};

  evs.forEach(function(e){if(!groups[e.date])groups[e.date]=[];groups[e.date].push(e);});

  var keys=Object.keys(groups).sort();

  var html='';

  keys.forEach(function(dateYmd){

    var d=ymdToDate(dateYmd);

    var label=d?(d.getDate()+' '+monthNameRuGen(d.getMonth())+' '+d.getFullYear()):dateYmd;

    html+='<div class="section-title" style="margin-top:14px">'+esc(label)+'</div>';

    html+=groups[dateYmd].map(renderEventCard).join('');

  return html;

}

function renderEventCard(e){

  var o=e.orderId?db.orders.find(function(x){return x.id===e.orderId;}):null;

  var t=e.type||'measure';

function openDayModal(dateYmd){

    var am=parseTimeToMinutes(a.time),bm=parseTimeToMinutes(b.time);

    if(bm==null)return -1;

async function evCalcRoute(){

  var type=window._evType||'measure';

  var orderId=parseInt((document.getElementById('ev_order')||{}).value||'0',10)||null;

  if(!orderId){uiAlert('Выберите заказ — нужен адрес для расчёта.');return;}

  var base=(db.settings&&db.settings.baseAddress)||'';

  if(!base){uiAlert('Сначала укажите «🏠 Адрес базы» в настройках.');return;}

  var o=db.orders.find(function(x){return x.id===orderId;});

  if(!o){uiAlert('Заказ не найден');return;}

  var toAddr=orderAddrString(o);

  if(!toAddr){uiAlert('У заказа не заполнен адрес.');return;}

  var el=document.getElementById('ev_geo_block');

  if(el)el.insertAdjacentHTML('afterbegin','<div id="ev_geo_loading" style="padding:8px 12px;background:var(--accent-soft);border-radius:10px;font-size:13px;font-weight:600;margin-bottom:8px">⏳ Считаем…</div>');

  try{

    var isReturn=(type==='return');

    var fromAddr=isReturn?toAddr:base;

    var toAddr2=isReturn?base:toAddr;

    var r=await calcRouteDistance(fromAddr,toAddr2);

    var ld=document.getElementById('ev_geo_loading');if(ld)ld.remove();

    if(!r||r.error){

      var msg=r&&r.error==='from'?'Не удалось определить адрес базы.':(r&&r.error==='to'?'Не удалось найти адрес заказа.':'OSRM не отвечает.');

      if(el)el.insertAdjacentHTML('afterbegin','<div style="padding:8px 12px;background:var(--danger-soft);color:var(--danger);border-radius:10px;font-size:13px;font-weight:600;margin-bottom:8px">❌ '+msg+' Введите расстояние вручную.</div>');

      return;

    }

    window._evLeg={km:r.km,minutes:r.minutes};

    var durEl=document.getElementById('ev_duration');

    if(durEl&&!durEl.value){

      var baseMeta=EVENT_TYPES.find(function(x){return x.key===type;});

      var defaultBase=(baseMeta&&baseMeta.defaultMin)||0;

      durEl.value=String(defaultBase+r.minutes);

    }

    if(el){

      var old=el.querySelector('.ev-leg-result');if(old)old.remove();

      el.insertAdjacentHTML('beforeend','<div class="ev-leg-result" style="margin-top:8px;padding:8px 12px;background:var(--ok-soft);color:#2c7a54;border-radius:10px;font-size:13px;font-weight:600">📏 '+numFmt(r.km)+' км • ⏱ '+formatDurationMin(r.minutes)+' <button type="button" class="chip" style="margin-left:8px;padding:4px 10px;font-size:11px" onclick="evApplyLegToDuration()">→ в длительность</button></div>');

    }

    evRecalcDurations();

  }catch(e){

    var ld2=document.getElementById('ev_geo_loading');if(ld2)ld2.remove();

    uiAlert('Ошибка: '+(e.message||e));

  }

}

function evApplyLegToDuration(){

  if(!window._evLeg)return;

  var type=window._evType||'measure';

  var meta=EVENT_TYPES.find(function(x){return x.key===type;});

  var base=(meta&&meta.defaultMin)||0;

  var el=document.getElementById('ev_duration');

  if(el)el.value=String(base+window._evLeg.minutes);

  evRecalcDurations();

}

async function saveEventForm(eventId){

  if(!canManageEvents()){uiAlert('Нет прав');return;}

  var v=function(id){return (document.getElementById(id)&&document.getElementById(id).value||'').trim();};

  var type=window._evType||'measure';

  var orderId=parseInt(v('ev_order'),10)||null;

  var date=v('ev_date');

  var time=v('ev_time');

  var note=v('ev_note');

  var team=(window._evTeam||[]).slice();

  var durEl=document.getElementById('ev_duration');

  var durManual=parseInt((durEl&&durEl.value)||'0',10)||0;

  if(!date){await uiAlert('Укажите дату');return;}

  haptic([15,40,15]);

  if(eventId){

    var e=eventById(eventId);if(!e){await uiAlert('Событие не найдено');return;}

    var oldDate=e.date,oldTime=e.time;

    e.type=type;e.orderId=orderId;e.date=date;e.time=time;e.note=note;e.assignedUserIds=team;e.duration=durManual;if(window._evLeg)e.legFromPrev=window._evLeg;

    var doneEl=document.getElementById('ev_done');

    if(doneEl)e.status=doneEl.checked?'done':'planned';

    touch(e);

    var changes=[];

    if(oldDate!==date){var od=ymdToDate(oldDate),nd=ymdToDate(date);changes.push('дата: '+(od?(pad2(od.getDate())+'.'+pad2(od.getMonth()+1)):'—')+' → '+(nd?(pad2(nd.getDate())+'.'+pad2(nd.getMonth()+1)):'—'));}

    if(oldTime!==time)changes.push('время: '+(oldTime||'—')+' → '+(time||'—'));

    if(changes.length)notifyEventMoved(e,changes.join(' • '),db.currentUserId);

    /* Новые участники — уведомить о назначении. */

    (e.assignedUserIds||[]).forEach(function(uid){

      if(uid===db.currentUserId)return;

      var hadAlready=Array.isArray(e.assignedUserIds);/* упрощённо: если уведомления уже были созданы для этого события и юзера — не плодим */

    });

  }else{

    var newE={id:db.nextEvent++,type:type,orderId:orderId,date:date,time:time,duration:durManual,assignedUserIds:team,note:note,status:'planned',createdAt:Date.now(),createdBy:db.currentUserId,updatedAt:Date.now(),legFromPrev:window._evLeg||null};

    db.events.push(newE);

    notifyEventCreated(newE,db.currentUserId);

  }

  save();

  window._evType=null;window._evTeam=null;window._evTeamToggle=null;window._evLeg=null;

  closeModal();

  render();

}

async function deleteEvent(eventId){

  if(!canManageEvents()){uiAlert('Нет прав');return;}

  var e=eventById(eventId);if(!e)return;

  var ok=await uiConfirm('Удалить событие?','Удаление',{danger:true,yesLabel:'Удалить'});

  if(!ok)return;

  notifyEventRemoved(e,db.currentUserId);

  db.events=db.events.filter(function(x){return x.id!==eventId;});

  purgeNotificationsForEvent(eventId);

  haptic(20);save();

  window._evType=null;window._evTeam=null;window._evTeamToggle=null;

  closeModal();render();

}

function renderRoutesTab(){

  var u=currentUser();if(!u)return '';

  var html='';

  var myCount=db.routes.filter(function(r){return r.assignedUserId===u.id;}).length;

  var canSeeAll=userCan('routes.viewAll');

  var total=db.routes.length;

  if(canSeeAll&&total>myCount){

    html+='<div style="text-align:center;margin-bottom:8px;font-size:12.5px;color:var(--muted);font-weight:600">Всего: '+total+' • моих: '+myCount+'</div>';

  }

  html+=renderRoutesList();

  return html;

}

function renderRoutesList(){

  var routes=db.routes.slice();

  var u=currentUser();

  if(u&&!userCan('routes.viewAll'))routes=routes.filter(function(r){return r.assignedUserId===u.id;});

  routes.sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''));});

  var html='';

  if(!routes.length){

    html+='<div class="empty-cta"><span class="ec-ico">🚚</span><div class="ec-title">Маршрутов пока нет</div><div class="ec-sub">Создайте маршрут — добавьте точки: заказы, контрагенты, свободные адреса.</div>'+(canManageRoutes()?'<button class="btn btn-primary" onclick="openRouteForm(null)">+ Новый маршрут</button>':'')+'</div>';

  }else{

    var today=dateToYmd(new Date());

    var groups={};

    routes.forEach(function(r){var k=r.date||'nodate';if(!groups[k])groups[k]=[];groups[k].push(r);});

    var keys=Object.keys(groups).sort();

    keys.forEach(function(dateYmd){

      var label;

      if(dateYmd==='nodate')label='📋 Без даты (планы)';

      else if(dateYmd===today)label='🔥 Сегодня — '+dateYmd.split('-').reverse().join('.');

      else{

        var d=ymdToDate(dateYmd);

        label=(d?d.getDate()+' '+monthNameRuGen(d.getMonth())+' '+d.getFullYear():dateYmd);

      }

      html+='<div class="section-title" style="margin-top:14px">'+esc(label)+'</div>';

      html+=groups[dateYmd].map(renderRouteCard).join('');

    });

  }

  if(canManageRoutes()&&routes.length)html+='<button type="button" class="btn-row-action" onclick="openRouteForm(null)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span>Новый маршрут</span></button>';

  html+='<div class="footer-brand">'+LOGO_MARK(20)+'<span>Зерцало • маршруты</span></div>';

  return html;

}

function renderRouteCard(r){

  var driver=r.assignedUserId?db.users.find(function(u){return u.id===r.assignedUserId;}):null;

  var pts=r.points||[];

  var dateLabel='';

  if(r.date){var d=ymdToDate(r.date);dateLabel=d?(pad2(d.getDate())+'.'+pad2(d.getMonth()+1)):'—';}

  else dateLabel='—';

  var html='<div class="route-card" onclick="openRoute('+r.id+')">';

  html+='<div class="route-head">';

  html+='<span class="route-date-chip">'+esc(dateLabel)+'</span>';

  html+='<span class="route-title">'+esc(r.title||'Маршрут')+'</span>';

  html+='</div>';

  if(driver)html+='<div class="route-sub"><span class="route-driver">🚚 '+esc(driver.name)+'</span></div>';

  html+='<div class="route-sub">📍 Точек: '+pts.length+'</div>';

  if(r.note)html+='<div class="route-sub" style="margin-top:4px">'+esc(r.note)+'</div>';

  html+='<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">';

function openRoute(id){

  var r=routeById(id);if(!r)return '';

  currentRouteId=id;

  if(activeTab!=='route_detail'){

    activeTab='route_detail';

    withViewTransition(function(){render();window.scrollTo(0,0);});

    try{history.pushState({view:'route',routeId:id},'','#route-'+id);}catch(e){}

    return '';

  }

  var driver=r.assignedUserId?db.users.find(function(u){return u.id===r.assignedUserId;}):null;

  var pts=r.points||[];

  var dateLabel=r.date?((function(){var d=ymdToDate(r.date);return d?(d.getDate()+' '+monthNameRuGen(d.getMonth())+' '+d.getFullYear()):r.date;})()):'Без даты';

  var html='<div style="padding:4px 0 8px"><div class="order-num-lg">'+esc(r.title||'Маршрут')+'</div><div class="order-date-lg">'+esc(dateLabel)+(driver?' • 🚚 '+esc(driver.name):'')+'</div></div>';

  if(r.note)html+='<div class="card no-tap" style="padding-left:20px"><div class="info-line" style="display:block"><span class="lbl" style="min-width:0">📝 '+esc(r.note)+'</span></div></div>';

  html+='<div class="section-title">📍 Точки ('+pts.length+')</div>';

  if(!pts.length)html+='<div class="empty" style="padding:20px;font-size:13px">Точек нет</div>';

  else html+=pts.map(function(p,idx){return renderRoutePoint(r,p,idx,pts.length);}).join('');

  html+='<button class="btn btn-primary" onclick="openRouteSheetPrint('+r.id+')">🖨 Маршрутный лист (A4)</button>';

  if(canManageRoutes())html+='<button class="btn btn-secondary" onclick="openRouteForm('+r.id+')">✏️ Редактировать маршрут</button>';

  if(canManageRoutes()&&pts.length)html+='<button class="btn btn-secondary" onclick="openRouteMap('+r.id+')">🗺 Открыть все адреса</button>';

  if(canManageRoutes())html+='<button class="btn btn-danger" onclick="deleteRoute('+r.id+')" style="margin-top:14px">Удалить маршрут</button>';

  html+='<div class="footer-brand" style="margin-bottom:20px">'+LOGO_MARK(20)+'<span>Зерцало</span></div>';

  return html;

}

function renderRoutePoint(r,p,idx,total){

  var kind=routePointKindInfo(p.kind);

  var title='',sub='';

  if(p.kind==='order'){

    var o=db.orders.find(function(x){return x.id===p.refId;});

    if(o){

      title='Заказ № '+(o.orderNum||'—')+' • '+(orderClientName(o)||'Без имени');

      var a=o.addressId?addressById(o.addressId):null;

      sub=a?addressFull(a):(orderAddressFull(o)||'—');

    }else{title='Заказ удалён';sub='';}

  }else if(p.kind==='contractor'){

    var co=contractorById(p.refId);

    if(co){

      title=co.name||'Контрагент';

      var a2=co.addressId?addressById(co.addressId):null;

      sub=a2?addressFull(a2):'—';

      if(co.phone)sub+=' • '+formatPhone(co.phone);

    }else{title='Контрагент удалён';sub='';}

  }else{

    title=p.label||'Свободный адрес';

    var a3=p.addressId?addressById(p.addressId):null;

    sub=a3?addressFull(a3):'';

  }

  if(p.time)sub='🕐 '+p.time+(sub?' • '+sub:'');

  if(p.note)sub+=(sub?' • ':'')+p.note;

  var actions=canManageRoutes()?'<div class="route-point-actions">'+

    '<button type="button" onclick="moveRoutePoint('+idx+',-1)" '+(idx===0?'disabled':'')+'>↑</button>'+

    '<button type="button" onclick="moveRoutePoint('+idx+',1)" '+(idx===total-1?'disabled':'')+'>↓</button>'+

    '<button type="button" class="danger" onclick="removeRoutePoint('+idx+')">✕</button>'+

    '</div>':'';

  return '<div class="route-point">'+

    '<div class="route-point-num">'+(idx+1)+'</div>'+

    '<div class="route-point-body">'+

      '<div class="route-point-kind">'+kind.ico+' '+esc(kind.label)+'</div>'+

      '<div class="route-point-title">'+esc(title)+'</div>'+

      (sub?'<div class="route-point-sub">'+esc(sub)+'</div>':'')+

    '</div>'+

    actions+

  '</div>';

}

function openRouteMap(routeId){

  var r=routeById(routeId);if(!r)return;

  var pts=r.points||[];

  if(!pts.length)return;

  var parts=[];

  pts.forEach(function(p){

    var addr=null;

    if(p.kind==='order'){var o=db.orders.find(function(x){return x.id===p.refId;});if(o&&o.addressId)addr=addressById(o.addressId);if(o&&!addr)addr={city:o.city,street:o.street,house:o.house};}

    else if(p.kind==='contractor'){var co=contractorById(p.refId);if(co&&co.addressId)addr=addressById(co.addressId);}

    else{addr=p.addressId?addressById(p.addressId):null;}

    if(addr){

      var s=addressFull(addr)||addressShort(addr);

      if(s)parts.push(s);

    }else if(p.label)parts.push(p.label);

  });

  if(!parts.length){uiAlert('Нет адресов для карты');return;}

  var first=encodeURIComponent(parts[0]);

  var ua=navigator.userAgent||'';

  var url;

  if(parts.length===1){

    url=/iphone|ipad|ipod/i.test(ua)?('https://maps.apple.com/?q='+first):('https://yandex.ru/maps/?text='+first);

  }else{

    var joined=parts.map(encodeURIComponent).join('~');

    url=/iphone|ipad|ipod/i.test(ua)?('https://maps.apple.com/?q='+first):('https://yandex.ru/maps/?rtext='+joined+'&rtt=auto');

  }

  window.open(url,'_blank');

}

  routeDraft=r?JSON.parse(JSON.stringify(r)):{

    title:'',

    date:dateToYmd(new Date()),

    assignedUserId:null,

    points:[],

    note:''

  };

  if(!Array.isArray(routeDraft.points))routeDraft.points=[];

  if(id)currentRouteId=id;

  renderRouteFormModal(id);

}

    var kind=routePointKindInfo(p.kind);

    var title='',sub='';

    if(p.kind==='order'){var o=db.orders.find(function(x){return x.id===p.refId;});if(o){title='№ '+(o.orderNum||'—')+' • '+(orderClientName(o)||'');}else title='Заказ удалён';}

    else if(p.kind==='contractor'){var co=contractorById(p.refId);title=co?(co.name||'Контрагент'):'Контрагент удалён';}

    else{var a=p.addressId?addressById(p.addressId):null;title=p.label||'Свободный адрес';sub=a?addressFull(a):'';}

    if(p.time)sub='🕐 '+p.time+(sub?' • '+sub:'');

    return '<div class="route-point">'+

      '<div class="route-point-num">'+(idx+1)+'</div>'+

      '<div class="route-point-body">'+

        '<div class="route-point-kind">'+kind.ico+' '+esc(kind.label)+'</div>'+

        '<div class="route-point-title">'+esc(title)+'</div>'+

        (sub?'<div class="route-point-sub">'+esc(sub)+'</div>':'')+

      '</div>'+

      '<div class="route-point-actions">'+

        '<button type="button" onclick="moveRoutePointDraft('+idx+',-1)" '+(idx===0?'disabled':'')+'>↑</button>'+

        '<button type="button" onclick="moveRoutePointDraft('+idx+',1)" '+(idx===r.points.length-1?'disabled':'')+'>↓</button>'+

        '<button type="button" class="danger" onclick="removeRoutePointDraft('+idx+')">✕</button>'+

      '</div>'+

    '</div>';

  }).join('')+'</div>';

  html+='<div class="shower-actions" style="margin-top:10px;flex-wrap:wrap">';

  html+='<button type="button" onclick="addRoutePointOrder()">+ Заказ</button>';

  if((db.settings&&db.settings.baseAddress)||'')html+='<button type="button" style="background:var(--ok-soft);color:#2c7a54;border-color:rgba(76,175,125,0.4)" onclick="addRoutePointBase()">🏠 Вернуться на базу</button>';

  html+='</div>';

  html+='<button class="btn btn-primary" onclick="saveRouteForm('+(editId||0)+')">Сохранить</button>';

  html+='<button class="btn btn-secondary" onclick="cancelRouteForm()">Отмена</button>';

  showModal(html);

}

function cancelRouteForm(){routeDraft=null;closeModal();if(currentRouteId&&activeTab==='route_detail')render();else render();}

function moveRoutePointDraft(idx,dir){

  var r=routeDraft;if(!r)return;

  var j=idx+dir;if(j<0||j>=r.points.length)return;

  var tmp=r.points[idx];r.points[idx]=r.points[j];r.points[j]=tmp;

  var editId=currentRouteId&&db.routes.find(function(x){return x.id===currentRouteId;})?currentRouteId:null;

  renderRouteFormModal(editId);

}

function removeRoutePointDraft(idx){

  if(!routeDraft)return;

  routeDraft.points.splice(idx,1);

  renderRouteFormModal(currentRouteId||null);

}

function addRoutePointOrder(){

  if(!routeDraft)return;

  var ords=visibleOrders().slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});

  if(!ords.length){uiAlert('Нет доступных заказов');return;}

  var opts=ords.map(function(o){return '<option value="'+o.id+'">'+(o.orderNum||'—')+' • '+(orderClientName(o)||'Без имени')+'</option>';}).join('');

function confirmAddRoutePointCustom(){

  var label=(document.getElementById('rpcs_label').value||'').trim();

  var addrLine=(document.getElementById('rpcs_addr').value||'').trim();

  var t=(document.getElementById('rpcs_time').value||'').trim();

  var note=(document.getElementById('rpcs_note').value||'').trim();

  var addressId=null;

  if(addrLine){

    var parts=addrLine.split(',').map(function(s){return s.trim();});

    var na={

      id:db.nextAddress++,

      clientId:null,

      label:label||'Свободный',

      city:parts[0]||'',

      street:parts[1]||'',

      house:parts[2]||'',

      building:'',entrance:'',floor:'',apartment:'',intercom:'',

      liftNeeded:false,liftFloor:0,parkingCarry:false,needPass:false,

      geoNote:'Свободная точка маршрута',

      createdAt:Date.now(),

      updatedAt:Date.now()

    };

    migrateAddress(na);

    db.addresses.push(na);

    addressId=na.id;

  }

  routeDraft.points.push({kind:'custom',refId:null,addressId:addressId,label:label||'Свободный адрес',note:note,time:t});

  renderRouteFormModal(currentRouteId||null);

}

async function saveRouteForm(editId){

  if(!canManageRoutes()){uiAlert('Нет прав');return;}

  if(!routeDraft){await uiAlert('Пустой маршрут');return;}

  var v=function(x){return (document.getElementById(x).value||'').trim();};

  var title=v('rt_title');

  var date=v('rt_date');

  var driverId=parseInt(v('rt_driver'),10)||null;

  var note=v('rt_note');

  if(!title&&!routeDraft.points.length){await uiAlert('Укажите название или добавьте точку');return;}

  haptic([15,40,15]);

  if(editId){

    var r=routeById(editId);if(!r){await uiAlert('Маршрут не найден');return;}

    var oldDriver=r.assignedUserId;

    var _oldTitle=r.title,_oldDate=r.date,_oldNote=r.note;

    var _oldPoints=JSON.stringify(r.points||[]);

    r.title=title;r.date=date||null;r.assignedUserId=driverId;r.note=note;r.points=routeDraft.points.slice();

    touch(r);

    if(driverId&&driverId!==oldDriver)notifyRouteAssigned(r,db.currentUserId);

    else if(driverId){

      var _ch=[];

      if((_oldTitle||'')!==(title||''))_ch.push('название');

      if((_oldDate||null)!==(date||null))_ch.push('дата');

      if((_oldNote||'')!==(note||''))_ch.push('заметка');

      if(_oldPoints!==JSON.stringify(r.points))_ch.push('точки');

      if(_ch.length)notifyRouteChanged(r,_ch.join(', '),db.currentUserId);

    }

  }else{

    var nr={id:db.nextRoute++,title:title,date:date||null,assignedUserId:driverId,points:routeDraft.points.slice(),note:note,createdAt:Date.now(),createdBy:db.currentUserId,updatedAt:Date.now()};

    db.routes.push(nr);

    if(driverId)notifyRouteAssigned(nr,db.currentUserId);

  }

  routeDraft=null;

  save();closeModal();

  render();

}

async function deleteRoute(id){

  if(!canManageRoutes()){uiAlert('Нет прав');return;}

  var r=routeById(id);if(!r)return;

  var ok=await uiConfirm('Удалить маршрут «'+(r.title||'')+'»?','Удаление',{danger:true,yesLabel:'Удалить'});

  if(!ok)return;

  notifyRouteRemoved(r,db.currentUserId);

  db.routes=db.routes.filter(function(x){return x.id!==id;});

  purgeNotificationsForRoute(id);

  if(currentRouteId===id){currentRouteId=null;activeTab='calendar';calState.section='routes';}

  haptic(20);save();

  withViewTransition(function(){render();window.scrollTo(0,0);});

}

function moveRoutePoint(idx,dir){

  var r=routeById(currentRouteId);if(!r)return;

  var j=idx+dir;if(j<0||j>=r.points.length)return;

  var tmp=r.points[idx];r.points[idx]=r.points[j];r.points[j]=tmp;

  touch(r);save();render();

}

async function removeRoutePoint(idx){

  var r=routeById(currentRouteId);if(!r)return;

  var ok=await uiConfirm('Удалить точку '+ (idx+1)+'?','Удаление',{danger:true,yesLabel:'Удалить'});

  if(!ok)return;

  r.points.splice(idx,1);touch(r);save();haptic(8);render();

}

function toggleContractorsArchived(){contractorsShowArchived=!contractorsShowArchived;render();}

function renderContractorsTab(){

  if(!canManageContractors())return '<div class="empty">Нет прав</div>';

  var html='<div class="search-bar"><input type="search" id="contractorsSearchInput" placeholder="🔍 Поиск контрагента" value="'+esc(contractorsSearchQ)+'" oninput="onContractorsSearchInput(this.value)"></div>';

  html+='<button type="button" class="chip sort-chip'+(contractorsShowArchived?' active':'')+'" onclick="toggleContractorsArchived()">'+(contractorsShowArchived?'✓ Архив':'📦 Архив')+'</button>';

  html+='</div>';

function renderContractorsList(){

  var list=db.contractors.slice();

  if(!contractorsShowArchived)list=list.filter(function(c){return !c.archived;});

  list.sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''),'ru');});

  var q=(contractorsSearchQ||'').trim().toLowerCase();

  if(q)list=list.filter(function(c){

    var addr=c.addressId?addressById(c.addressId):null;

    var str=(c.name+' '+(c.contactName||'')+' '+(c.phone||'')+' '+(c.email||'')+' '+(addr?addressShort(addr)+' '+addressFull(addr):'')).toLowerCase();

    return str.indexOf(q)>=0;

  });

  if(!list.length)return '<div class="empty-cta"><span class="ec-ico">🏢</span><div class="ec-title">Контрагентов пока нет</div><div class="ec-sub">Добавьте поставщиков, партнёров и склады — их можно включать в маршруты.</div>'+(canManageContractors()?'<button class="btn btn-primary" onclick="openContractorForm(null)">+ Новый контрагент</button>':'')+'</div>';

  return list.map(renderContractorCard).join('');

}

function renderContractorCard(c){

  var cat=contractorCategoryInfo(c.category);

  var addr=c.addressId?addressById(c.addressId):null;

  var arch=c.archived?'<span class="role-badge" style="background:#f0f4fa;color:#8894a9">📦 Архив</span>':'';

  var html='<div class="contractor-card" onclick="openContractorForm('+c.id+')" style="opacity:'+(c.archived?'0.6':'1')+'">';

  html+='<span class="contractor-cat '+c.category+'">'+cat.ico+' '+esc(cat.label)+'</span> '+arch;

  html+='<div class="card-title" style="margin-top:2px">'+esc(c.name||'Без названия')+'</div>';

  if(c.contactName)html+='<div class="card-sub">👤 '+esc(c.contactName)+'</div>';

  if(c.phone)html+='<div class="card-sub">📞 '+esc(formatPhone(c.phone))+'</div>';

  if(addr)html+='<div class="card-sub">📍 '+esc(addressShort(addr)||addressFull(addr))+'</div>';

  html+='</div>';

  return html;

}

    name:c.name||'',

    category:c.category||'other',

    contactName:c.contactName||'',

    phone:c.phone||'',

    email:c.email||'',

    note:c.note||'',

    addressId:c.addressId||null

  }:{name:'',category:'other',contactName:'',phone:'',email:'',note:'',addressId:null};

  db.addresses.slice().sort(function(a,b){return String(addressShort(a)||'').localeCompare(String(addressShort(b)||''),'ru');}).forEach(function(a){

    var lbl=(a.label? a.label+' • ':'')+(addressShort(a)||addressFull(a)||'Адрес без данных');

  html+='<label>Категория</label><div class="chips" id="co_cat_chips">'+CONTRACTOR_CATEGORIES.map(function(cat){

    return '<button type="button" class="chip'+(cat.key===d.category?' active':'')+'" data-val="'+cat.key+'" onclick="window._coCat=\''+cat.key+'\';var p=this.parentNode;p.querySelectorAll(\'.chip\').forEach(function(x){x.classList.toggle(\'active\',x.dataset.val===window._coCat);});">'+cat.ico+' '+esc(cat.label)+'</button>';

  }).join('')+'</div>';

  html+='<label>Контактное лицо</label><input id="co_contact" value="'+esc(d.contactName)+'">';

  html+='<label>Телефон</label><input id="co_phone" type="tel" value="'+esc(d.phone)+'">';

  html+='<label>Email</label><input id="co_email" type="email" value="'+esc(d.email)+'">';

  html+='<label>Адрес</label><select id="co_address">'+addrOptions+'</select>';

  html+='<button class="btn btn-secondary" style="padding:10px;font-size:14px;margin-top:8px" onclick="openNewAddressForContractor()">+ Новый адрес</button>';

  html+='<label>Заметка</label><textarea id="co_note" rows="2">'+esc(d.note)+'</textarea>';

    html+='<button class="btn btn-secondary" onclick="'+(c.archived?'unarchiveContractor':'archiveContractor')+'('+c.id+')">'+(c.archived?'↩ Из архива':'📦 В архив')+'</button>';

    html+='<button class="btn btn-danger" onclick="deleteContractor('+c.id+')">Удалить</button>';

  html+='<button class="btn btn-primary" onclick="saveContractorForm('+(c?c.id:0)+')">Сохранить</button>';

  html+='<button class="btn btn-secondary" onclick="closeModal()">Отмена</button>';

  showModal(html);

  window._coCat=d.category;

}

async function saveContractorForm(id){

  if(!canManageContractors()){uiAlert('Нет прав');return;}

  var v=function(x){return (document.getElementById(x).value||'').trim();};

  var name=v('co_name');

  if(!name){await uiAlert('Введите название');return;}

  var cat=window._coCat||'other';

  var contactName=v('co_contact');

  var phone=normalizePhone(v('co_phone'));

  var email=v('co_email');

  var note=v('co_note');

  var addressId=parseInt(v('co_address'),10)||null;

  haptic([15,40,15]);

  if(id){

    var c=contractorById(id);if(!c){await uiAlert('Контрагент не найден');return;}

    c.name=name;c.category=cat;c.contactName=contactName;c.phone=phone;c.email=email;c.note=note;c.addressId=addressId;touch(c);

  }else{

    db.contractors.push({id:db.nextContractor++,name:name,category:cat,contactName:contactName,phone:phone,email:email,note:note,addressId:addressId,createdAt:Date.now(),createdBy:db.currentUserId,archived:false,updatedAt:Date.now()});

  }

  window._coCat=null;

  save();closeModal();render();

}

function openNewAddressForContractor(){

  if(!canManageAddresses()){uiAlert('Нет прав');return;}

  window._returnToContractor=true;

  openAddressForm(null,null);

}

async function archiveContractor(id){

  var c=contractorById(id);if(!c)return;

  if(!canManageContractors()){uiAlert('Нет прав');return;}

  var ok=await uiConfirm('Убрать «'+(c.name||'')+'» в архив?','Архив',{yesLabel:'В архив'});

  if(!ok)return;

  c.archived=true;touch(c);save();haptic(8);closeModal();render();

}

async function unarchiveContractor(id){

  var c=contractorById(id);if(!c)return;

  if(!canManageContractors()){uiAlert('Нет прав');return;}

  c.archived=false;touch(c);save();haptic(8);closeModal();render();

}

async function deleteContractor(id){

  var c=contractorById(id);if(!c)return;

  if(!canManageContractors()){uiAlert('Нет прав');return;}

  var used=db.routes.filter(function(r){return (r.points||[]).some(function(p){return p.kind==='contractor'&&p.refId===id;});}).length;

  if(used){uiAlert('Контрагент используется в '+used+' маршрут(ах). Используйте архив.');return;}

  var ok=await uiConfirm('Удалить контрагента «'+(c.name||'')+'»?','Удаление',{danger:true,yesLabel:'Удалить'});

  if(!ok)return;

  db.contractors=db.contractors.filter(function(x){return x.id!==id;});

  haptic(20);save();closeModal();render();

}

function openUsers(){

  if(!canManageUsers()){uiAlert('Нет прав');return;}

  var showInactive=!!window._showInactiveUsers;

  var active=db.users.filter(function(u){return u.active;});

  var inactive=db.users.filter(function(u){return !u.active;});

  var html='<h2>'+LOGO_MARK(30)+' Пользователи</h2>';

  html+='<div class="section-title">Активные ('+active.length+')</div>';

  if(!active.length)html+='<div class="empty" style="padding:20px;font-size:13px">Нет пользователей</div>';

  active.forEach(function(u){

    var canEdit=canManageUser(u),canDel=canDeleteUser(u);

    html+='<div class="shower-item" style="margin-bottom:8px"><div class="shower-item-head"><span class="shower-item-type"><span class="role-badge role-'+u.role+'">'+(ROLE_META[u.role]?ROLE_META[u.role].label:u.role)+'</span> '+esc(u.name)+'</span></div>'+

      (u.phone?'<div class="card-sub" style="margin-top:4px">📞 <a class="tap-link" href="'+phoneHref(u.phone)+'">'+esc(formatPhone(u.phone))+'</a></div>':'')+

      '<div class="shower-hint" style="text-align:left;margin-top:4px">'+(u.lastLogin?('Вход: '+new Date(u.lastLogin).toLocaleString('ru-RU')):'Не входил')+'</div>'+

      (canEdit||canDel?'<div class="chips" style="margin-top:6px">'+

        (canEdit?'<button type="button" class="chip" onclick="closeModal();openEditUser('+u.id+')">✏️ Изменить</button>':'')+

        (canEdit?'<button type="button" class="chip" onclick="adminSetUserPin('+u.id+')">🔑 Задать PIN</button>':'')+

        (canDel?'<button type="button" class="chip" style="background:var(--danger-soft);color:var(--danger)" onclick="deactivateUser('+u.id+')">⛔ Отключить</button>':'')+

      '</div>':'')+

    '</div>';

  });

  if(showInactive&&inactive.length){

    html+='<div class="section-title">Отключённые ('+inactive.length+')</div>';

    inactive.forEach(function(u){

      html+='<div class="shower-item" style="margin-bottom:8px;opacity:0.7"><div class="shower-item-head"><span class="shower-item-type"><span class="role-badge">'+(ROLE_META[u.role]?ROLE_META[u.role].label:u.role)+'</span> '+esc(u.name)+'</span></div>'+

        (u.phone?'<div class="card-sub" style="margin-top:4px">📞 '+esc(formatPhone(u.phone))+'</div>':'')+

        '<div class="chips" style="margin-top:6px"><button type="button" class="chip" onclick="reactivateUser('+u.id+')">↩ Включить</button>'+(userHasOrders(u.id)?'':'<button type="button" class="chip" style="background:var(--danger-soft);color:var(--danger)" onclick="hardDeleteUser('+u.id+')">✕ Удалить навсегда</button>')+'</div>'+

      '</div>';

    });

  }

  html+='<button class="btn btn-primary" onclick="closeModal();openCreateUser()">+ Создать пользователя</button>';

  html+='<button class="btn btn-secondary" onclick="window._showInactiveUsers='+(showInactive?'false':'true')+';closeModal();openUsers()">'+(showInactive?'Скрыть отключённых':'Показать отключённых')+'</button>';

  html+='<button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>';

  showModal(html);

}

function openCreateUser(){

  if(!canManageUsers()){uiAlert('Нет прав');return;}

  var me=currentUser(),roles=assignableRoles(me);

  showModal('<h2>'+LOGO_MARK(30)+' Новый пользователь</h2>'+

    '<label>ФИО</label><input id="cu_name" placeholder="Иванов Иван Иванович">'+

    '<label>Телефон</label><input id="cu_phone" type="tel" placeholder="+7 900 000-00-00">'+

    '<label>PIN (4 цифры)</label><input id="cu_pin" type="text" inputmode="numeric" maxlength="4" placeholder="0000">'+

    '<label>Роль</label><div class="role-picker" id="cu_roles">'+roles.map(function(r,i){return '<button type="button" class="role-btn '+(i===0?'active':'')+'" data-val="'+r+'"><span class="rb-ico">'+ROLE_META[r].ico+'</span><span>'+ROLE_META[r].label+'</span></button>';}).join('')+'</div>'+

    '<div class="checkbox-row"><input type="checkbox" id="cu_must" checked><label for="cu_must">Требовать смену PIN при входе</label></div>'+

    '<button class="btn btn-primary" onclick="saveCreateUser()">Создать</button>'+

    '<button class="btn btn-secondary" onclick="closeModal()">Отмена</button>');

  var sel=roles[0]||'surveyor';

  document.querySelectorAll('#cu_roles .role-btn').forEach(function(b){b.onclick=function(){document.querySelectorAll('#cu_roles .role-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');sel=b.dataset.val;};});

  window._cuRole=function(){return sel;};

}

async function saveCreateUser(){

  if(!canManageUsers()){uiAlert('Нет прав');return;}

  var name=(document.getElementById('cu_name').value||'').trim();

  var phone=(document.getElementById('cu_phone').value||'').trim();

  var pin=(document.getElementById('cu_pin').value||'').trim();

  var role=window._cuRole?window._cuRole():'surveyor';

  var must=document.getElementById('cu_must').checked;

  if(!name){await uiAlert('Введите ФИО');return;}

  if(phoneDigits(phone).length<6){await uiAlert('Введите телефон (мин. 6 цифр)');return;}

  if(userByPhone(phone)){await uiAlert('Такой телефон уже есть');return;}

  if(!/^\d{4}$/.test(pin)){await uiAlert('PIN — 4 цифры');return;}

  if(assignableRoles(currentUser()).indexOf(role)<0){await uiAlert('Нет прав на роль');return;}

  var me=currentUser();

  var u={id:db.nextUser++,name:name,role:role,login:normalizePhone(phone),phone:normalizePhone(phone),pinHash:null,pinPlain:null,active:true,createdBy:me.id,createdAt:Date.now(),lastLogin:0,note:'',mustChangePassword:must,permsOverride:null,updatedAt:Date.now()};

  db.users.push(u);

  await setUserPassword(u.id,pin);

  u.mustChangePassword=must;

  save();closeModal();

  await uiAlert('Пользователь создан\nPIN: '+pin+(must?'\n\nСменит при входе.':''));

  openUsers();

}

function openEditUser(uid){

  var u=db.users.find(function(x){return x.id===uid;});if(!u){uiAlert('Не найден');return;}

  if(!canManageUser(u)){uiAlert('Нет прав');return;}

  var me=currentUser(),roles=assignableRoles(me);

  var currentRole=roles.indexOf(u.role)>=0?u.role:(roles[0]||u.role);

  showModal('<h2>'+LOGO_MARK(30)+' Редактирование</h2>'+

    '<label>ФИО</label><input id="eu_name" value="'+esc(u.name)+'">'+

    '<label>Телефон</label><input id="eu_phone" type="tel" value="'+esc(u.phone||'')+'">'+

    '<div class="section-title">PIN (оставьте пустым, чтобы не менять)</div>'+

    '<input id="eu_pin" type="text" inputmode="numeric" maxlength="4" placeholder="••••">'+

    '<label>Роль</label><div class="role-picker" id="eu_roles">'+roles.map(function(r){return '<button type="button" class="role-btn '+(r===currentRole?'active':'')+'" data-val="'+r+'"><span class="rb-ico">'+ROLE_META[r].ico+'</span><span>'+ROLE_META[r].label+'</span></button>';}).join('')+'</div>'+

    '<div class="checkbox-row"><input type="checkbox" id="eu_must" '+(u.mustChangePassword?'checked':'')+'><label for="eu_must">Требовать смену PIN при входе</label></div>'+

    '<button class="btn btn-primary" onclick="saveEditUser('+u.id+')">Сохранить</button>'+

    '<button class="btn btn-secondary" onclick="closeModal();openUsers()">Отмена</button>');

  var sel=currentRole;

  document.querySelectorAll('#eu_roles .role-btn').forEach(function(b){b.onclick=function(){document.querySelectorAll('#eu_roles .role-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');sel=b.dataset.val;};});

  window._euRole=function(){return sel;};

}

async function saveEditUser(uid){

  var u=db.users.find(function(x){return x.id===uid;});

  if(!u||!canManageUser(u)){uiAlert('Нет прав');return;}

  var name=(document.getElementById('eu_name').value||'').trim();

  var phone=(document.getElementById('eu_phone').value||'').trim();

  var pin=(document.getElementById('eu_pin').value||'').trim();

  var role=window._euRole?window._euRole():u.role;

  var must=document.getElementById('eu_must').checked;

  if(!name){await uiAlert('Введите ФИО');return;}

  if(phoneDigits(phone).length<6){await uiAlert('Введите телефон');return;}

  var dup=userByPhone(phone);if(dup&&dup.id!==uid){await uiAlert('Телефон занят');return;}

  if(assignableRoles(currentUser()).indexOf(role)<0){await uiAlert('Нет прав на роль');return;}

  if(pin&&!/^\d{4}$/.test(pin)){await uiAlert('PIN — 4 цифры');return;}

  u.name=name;u.phone=normalizePhone(phone);u.login=normalizePhone(phone);u.role=role;u.mustChangePassword=must;touch(u);

  if(pin)await setUserPassword(u.id,pin);

  save();closeModal();openUsers();

}

async function reactivateUser(uid){var u=db.users.find(function(x){return x.id===uid;});if(!u)return;u.active=true;touch(u);save();openUsers();}

async function deactivateUser(uid){var u=db.users.find(function(x){return x.id===uid;});if(!u)return;if(!canDeleteUser(u)){uiAlert('Нет прав');return;}var ok=await uiConfirm('Отключить «'+u.name+'»?','Отключение',{danger:true,yesLabel:'Отключить'});if(!ok)return;u.active=false;touch(u);if(db.currentUserId===uid){db.currentUserId=null;db.sessionExpiresAt=0;}save();closeModal();openUsers();}

async function hardDeleteUser(uid){var u=db.users.find(function(x){return x.id===uid;});if(!u)return;if(!canDeleteUser(u)){uiAlert('Нет прав');return;}if(userHasOrders(uid)){uiAlert('У пользователя есть заказы. Можно только отключить.');return;}var ok=await uiConfirm('Удалить «'+u.name+'» навсегда?','Удаление',{danger:true,yesLabel:'Удалить'});if(!ok)return;db.users=db.users.filter(function(x){return x.id!==uid;});save();openUsers();}

async function adminSetUserPin(uid){var u=db.users.find(function(x){return x.id===uid;});if(!u)return;if(!canManageUser(u)){uiAlert('Нет прав');return;}var v=await uiPrompt('Новый PIN для «'+u.name+'»','',{type:'text',inputmode:'numeric'});if(v==null)return;v=String(v).trim();if(!/^\d{4}$/.test(v)){await uiAlert('PIN — 4 цифры');return;}await setUserPin(u.id,v);save();await uiAlert('PIN установлен: '+v);}



/* === ЭКРАН «РОЛИ И ПРАВА» === */

function openRolesSettings(){

  if(!canManageUsers()){uiAlert('Нет прав');return;}

  var roleKeys=Object.keys(ROLE_DEFAULTS);

  if(!window._rolesActiveRole||roleKeys.indexOf(window._rolesActiveRole)<0)window._rolesActiveRole='admin';

  renderRolesSettings();

}

function renderRolesSettings(){

  var role=window._rolesActiveRole||'admin';

  var rp=rolePermissions(role);

  var tabs=Object.keys(ROLE_DEFAULTS).map(function(k){

    return '<button type="button" class="role-tab '+(k===role?'active':'')+'" onclick="switchRolesTab(\''+k+'\')">'+ROLE_META[k].ico+' '+esc(ROLE_META[k].label)+'</button>';

  }).join('');

  var html='<h2>'+LOGO_MARK(30)+' Роли и права</h2>';

  html+='<div class="draft-notice">Изменения применяются сразу ко всем пользователям с этой ролью.<br>Индивидуальные override задаются в карточке пользователя (в разработке).</div>';

  html+='<div class="role-tab-row" id="rolesTabRow">'+tabs+'</div>';

  html+='<div id="permGroupsWrap">';

  PERM_GROUPS.forEach(function(g){

    html+='<div class="perm-group"><h4>'+esc(g.label)+'</h4>';

    g.perms.forEach(function(pk){

      var info=permInfo(pk);

      var on=!!rp[pk];

      html+='<label class="perm-row"><span class="plabel">'+esc(info.label)+'<span class="pdesc">'+esc(info.desc||'')+'</span></span><input type="checkbox" '+(on?'checked':'')+' onchange="setRolePerm(\''+role+'\',\''+pk+'\',this.checked)"></label>';

    });

    html+='</div>';

  });

  html+='</div>';

  html+='<button class="btn btn-secondary" onclick="resetRolePerms(\''+role+'\')">↺ Сбросить к стандартным</button>';

  html+='<button class="btn btn-primary" onclick="closeModal();render()">Готово</button>';

  showModal(html);

}

function switchRolesTab(k){

  window._rolesActiveRole=k;

  renderRolesSettings();

}

function setRolePerm(role,permKey,on){

  if(!canManageUsers()){uiAlert('Нет прав');return;}

  if(!db.roles)db.roles={};

  if(!db.roles[role]||typeof db.roles[role]!=='object')db.roles[role]=Object.assign({},ROLE_DEFAULTS[role]||{});

  db.roles[role][permKey]=!!on;

  /* Если набор полностью совпадает с дефолтом — обнулим override. */

  var base=ROLE_DEFAULTS[role]||{},keys=Object.keys(PERMISSIONS),same=true;

  for(var i=0;i<keys.length;i++){var kk=keys[i];if(!!db.roles[role][kk]!==!!base[kk]){same=false;break;}}

  if(same)db.roles[role]=null;

  touch(db.sync||{});/* мягко помечаем для синхронизации */

  save();

  haptic(6);

}

async function resetRolePerms(role){

  if(!canManageUsers()){uiAlert('Нет прав');return;}

  var ok=await uiConfirm('Сбросить права роли «'+(ROLE_META[role]?ROLE_META[role].label:role)+'» к стандартным?','Сброс',{yesLabel:'Сбросить'});

  if(!ok)return;

  if(db.roles&&db.roles[role])delete db.roles[role];

  save();haptic(8);

  renderRolesSettings();

}

function buildReceiptModel(o,items){

    date:new Date(o.createdAt),

    createdAt:o.createdAt,

    measureDate:o.measureDate||null,

    orderTotal:Number(o.orderTotal)||0,

    orderPaid:Number(o.orderPaid)||0,

    client:{

      fullName:orderClientName(o),phone:orderClientPhone(o),address:orderAddressFull(o),intercom:o.intercom||'',

      liftNeeded:!!o.liftNeeded,liftFloor:o.liftFloor||0,parkingCarry:!!o.parkingCarry,

      needPass:!!o.needPass,paid:!!o.paid,paidAmount:o.paidAmount||0,notes:o.clientNote||''

    },

    items:[],

    contacts:{

      phone:(db.settings&&db.settings.phone)||'',

      email:(db.settings&&db.settings.email)||'',

      website:(db.settings&&db.settings.website)||'',

      telegram:(db.settings&&db.settings.telegram)||'',

      slogan:(db.settings&&db.settings.slogan)||'замеры'

    }

  };

  items.forEach(function(i,idx){

    var it={index:idx+1,typeKey:i.type||'MIRROR',typeLabel:typeInfo(i.type).label,title:shapeLabel(i),qty:i.qty,rows:[],photosCount:(i.photos&&i.photos.length)||0,drawingIsoId:i.drawingIsoId||null,drawingFrontId:i.drawingFrontId||null,area:calcArea(i).toFixed(3),perimeter:calcPerim(i).toFixed(2),note:i.note||''};

    var R=it.rows;

    if(i.type==='MIRROR'&&isMirrorNicheMode(i)){var g=getMirrorNicheAndGlass(i),n=g.niche,gl=g.glass;if(i.shape==='RECT4'){R.push({k:'🎯 Ниша',v:'В'+numFmt(n.T)+' / Н'+numFmt(n.B)+' / Л'+numFmt(n.L)+' / П'+numFmt(n.R)});R.push({k:'🪞 Зеркало',v:'В'+numFmt(gl.T)+' / Н'+numFmt(gl.B)+' / Л'+numFmt(gl.L)+' / П'+numFmt(gl.R)});}else{R.push({k:'🎯 Ниша',v:numFmt(n.T)+' × '+numFmt(n.L)+' см'});R.push({k:'🪞 Зеркало',v:numFmt(gl.w||gl.T)+' × '+numFmt(gl.h||gl.L)+' см'});}var _sk=analyzeNicheSkew(i);if(_sk.isSkewed){R.push({k:'📐 Закос',v:'В-Н '+numFmt(_sk.vSkew)+', Л-П '+numFmt(_sk.hSkew)});R.push({k:'✂️ Рез',v:(i.mirrorNicheCutMode==='bevel'?'на косую':'по меньшему')});}}

    if(i.type==='APRON'){R.push({k:'Материал',v:apronMaterialFullLabel(i)});var shp=(i.apronShape==='L')?'Г-образная':(i.apronShape==='U')?'П-образная':'Прямая';R.push({k:'Форма',v:shp});var modLbl=(i.apronMeasureMode==='glass')?'стекло':(i.apronMeasureMode==='both'?'ниша + стекло':('ниша − '+numFmt(i.apronInset||1.5)+' мм'));R.push({k:'Замер',v:modLbl});(i.apronSections||[]).forEach(function(s,si){var nm=(i.apronShape==='straight')?'Ниша':('Секция '+(si+1));R.push({k:nm,v:'В'+numFmt(s.top!=null?s.top:s.bottom)+' / Н'+numFmt(s.bottom)+' / Л'+numFmt(s.left)+' / П'+numFmt(s.right)});});}

    else{

      R.push({k:'Стекло',v:mirrorColorFullLabel(i)+(i.tempered?' (закалённое)':'')});

      if(i.type==='MIRROR'&&i.roundedCorners&&(i.shape==='RECT'||i.shape==='RECT4')&&Number(i.cornerRadius)>0)R.push({k:'⭕ Скругление',v:'R'+numFmt(i.cornerRadius)+' мм'});

      if(edgeLabel(i))R.push({k:'Кромка',v:edgeLabel(i)});

      if(hasFrame(i))R.push({k:'Рама',v:frameLabel(i)});

      if(i.type==='PANNO')R.push({k:'Разбивка',v:pannoLabel(i)});

      if(i.type==='SHELF')R.push({k:'Глубина',v:numFmt(i.shelfDepth||15)+' см'});

      if(i.type==='SHOWER'){

        R.push({k:'Высота',v:numFmt(i.showerH||220)+' см'});

        R.push({k:'Основание',v:(i.showerBaseType==='tray')?'поддон':'пол'});

        if(i.baseW||i.baseD)R.push({k:'Размер основания',v:numFmt(i.baseW||0)+'×'+numFmt(i.baseD||0)});

        (i.showerPanels||[]).forEach(function(p,pi){R.push({k:'',v:(p.type==='door'?'Дверь':'Добор')+' '+(pi+1)+': проём '+numFmt(p.length)+', стекло '+numFmt(showerGlassLength(p,i))+(pi>0?(', угол '+numFmt(p.angle||0)+'°'):'')});});

        if(i.hingeCount)R.push({k:'Петли',v:i.hingeCount+' шт'});

        var rodP=(i.showerProfiles||[]).find(function(p){return p.kind==='rod';});

        if(rodP)R.push({k:'Штанга',v:numFmt(rodP.offsetFromTop||4)+' см от верха • '+((rodP.mount==='left')?'к началу':'к концу')+' панели • '+numFmt(rodP.wallLen||30)+' см до стены'});

          R.push({k:'Ручка',v:hI.label+(i.showerHandle.offsetFromTop?(' • '+numFmt(i.showerHandle.offsetFromTop)+' см от верха'):'')});

          if(hI.holes>=2)R.push({k:'Отверстия',v:'Ø'+numFmt(i.showerHandle.holeDiameter)+' мм • между осями '+numFmt(i.showerHandle.holeDistance)+' мм'});
