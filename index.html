<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6f8fc">
<title>Зерцало — Замеры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<link id="appManifest" rel="manifest">
<style>
:root{color-scheme:light;--bg1:#f6f8fc;--bg2:#eef3fa;--accent:#5b7fb8;--accentD:#3b5c8f;--soft:#eaf1fb;--line:#d6e2f3;--text:#2a3547;--soft2:#5a6780;--muted:#8894a9;--bd:#e8eef7;--surface:#fff;--ok:#4caf7d;--warn:#d9924a;--danger:#c96565;--r:20px;--rb:14px;--sh:0 2px 10px rgba(90,120,170,.07);--shM:0 8px 28px rgba(90,120,170,.09);--mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme=dark]{color-scheme:dark;--bg1:#141a24;--bg2:#101621;--accent:#7ba0dd;--accentD:#a8c3eb;--soft:rgba(123,160,221,.14);--line:rgba(123,160,221,.28);--text:#e6ecf5;--soft2:#b6c2d4;--muted:#8a97ac;--bd:#232c3b;--surface:#1c2431;--sh:0 2px 10px rgba(0,0,0,.35);--shM:0 8px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:var(--text);font-size:16px;line-height:1.45;background:var(--bg1);-webkit-font-smoothing:antialiased}
html[data-theme] body{background-image:radial-gradient(ellipse 60% 40% at 15% 5%,rgba(184,209,247,.45),transparent 60%),radial-gradient(ellipse 70% 50% at 50% 100%,rgba(196,231,248,.45),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2))}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--bd)}
header button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accentD);border:none;border-radius:12px;font-size:20px;font-weight:600;cursor:pointer;flex-shrink:0}
.header-logo{flex:1;display:flex;align-items:center;min-width:0}
.header-logo svg{height:40px;max-width:100%}
.header-user{display:none;flex-direction:column;align-items:flex-end;padding:4px 10px;background:var(--soft);border-radius:12px;cursor:pointer}
.header-user.visible{display:flex}
.hu-name{font-weight:700;font-size:12px;color:var(--accentD)}
.hu-role{font-size:10px;color:var(--muted);text-transform:uppercase}
.container{padding:16px;max-width:720px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--surface);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer;position:relative}
.card.no-tap{cursor:default}
.card::before{content:'';position:absolute;left:8px;top:14px;bottom:14px;width:4px;border-radius:4px;background:transparent}
.card.t-MIRROR::before{background:#3b5c8f}.card.t-SHOWER::before{background:#3a7a5a}.card.t-APRON::before{background:#a05c26}.card.t-SHELF::before{background:#6a4b9a}.card.t-PANNO::before{background:#9d3668}
.card-title{font-weight:600;font-size:16px;margin-bottom:4px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.card-sub{color:var(--muted);font-size:13px;line-height:1.5}
.type-badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}
.type-MIRROR{background:#eaf1fb;color:#3b5c8f}.type-SHOWER{background:#e8f4ee;color:#3a7a5a}.type-APRON{background:#fcefe0;color:#a05c26}.type-SHELF{background:#f0ebf8;color:#6a4b9a}.type-PANNO{background:#fbe9f2;color:#9d3668}
.btn{display:block;width:100%;padding:14px 20px;border:none;border-radius:var(--rb);font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;font-family:inherit;text-align:center}
.btn-primary{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff}
.btn-secondary{background:var(--soft);color:var(--accentD)}
.btn-danger{background:#fcedec;color:var(--danger)}
.btn-tg{background:linear-gradient(135deg,#4fb5e6,#229ED9);color:#fff}
.fab{position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;border:none;border-radius:999px;padding:16px 24px;font-size:15px;font-weight:600;font-family:inherit;box-shadow:var(--shM);cursor:pointer;z-index:50}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;font-size:16px;font-family:inherit;margin-top:6px;background:var(--surface);color:var(--text);-webkit-appearance:none}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
label{display:block;margin-top:12px;font-size:13px;color:var(--soft2);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0;margin-top:6px;flex-wrap:wrap;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;border-radius:999px;background:var(--soft);border:none;white-space:nowrap;font-size:13px;font-weight:500;cursor:pointer;color:var(--soft2);flex-shrink:0;font-family:inherit}
.chip.active{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff}
.chip.chip-multi.active{background:linear-gradient(135deg,#4fb5e6,#229ED9)}
.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:8px}
.type-btn{padding:14px 8px;border-radius:12px;border:1.5px solid var(--bd);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--soft2);display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit}
.type-btn .ico{font-size:24px}
.type-btn.active{border-color:var(--accent);background:var(--soft);color:var(--accentD)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.section-title{font-size:12px;font-weight:700;color:var(--accentD);margin-top:24px;padding-bottom:8px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.checkbox-row{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 16px;background:var(--soft);border-radius:12px}
.checkbox-row.niche-row{background:linear-gradient(135deg,rgba(160,120,220,.14),rgba(160,120,220,.06))}
.checkbox-row input[type=checkbox]{-webkit-appearance:none;width:52px;height:32px;margin:0;flex-shrink:0;border-radius:999px;background:#d0d7e2;position:relative;cursor:pointer;border:none}
.checkbox-row input[type=checkbox]::before{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .24s}
.checkbox-row input[type=checkbox]:checked{background:linear-gradient(135deg,#7b9dd1,#5b7fb8)}
.checkbox-row input[type=checkbox]:checked::before{transform:translateX(20px)}
.checkbox-row label{margin:0;font-size:14px;color:var(--text);cursor:pointer}
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(50,70,100,.3);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:720px;max-height:94vh;overflow-y:auto;padding:20px 18px 40px;position:relative}
.modal h2{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:10px}
#__dlg{position:fixed;inset:0;z-index:600;background:rgba(50,70,100,.35);display:flex;align-items:center;justify-content:center;padding:20px}
#__dlg .dlg{background:var(--surface);border-radius:20px;width:100%;max-width:460px;padding:22px}
#__dlg h2{margin:0 0 8px;font-size:18px}
.calc-box{background:var(--soft);border-radius:14px;padding:14px;margin-top:16px;font-size:13px;line-height:1.5}
.calc-box .calc-title{display:block;font-weight:700;font-size:14px;color:var(--accentD);margin-bottom:8px}
.calc-box .calc-elec{margin-top:8px;padding:8px 12px;border-radius:10px;background:rgba(255,215,0,.18);border:1.5px solid rgba(230,190,40,.5);color:#7a5a0c;font-weight:600}
.calc-row{padding:2px 0}
.calc-row b{color:var(--accentD)}
.item-card{display:flex;align-items:center;gap:12px}
.item-card .info{flex:1;min-width:0}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px}
.del-x{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;padding:6px 10px;font-weight:600;font-family:inherit}
.info-line{display:flex;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--bd)}
.info-line .lbl{color:var(--muted);min-width:100px;font-weight:500}
.info-line .val{color:var(--text);font-weight:500;word-break:break-word}
.tap-link{color:var(--accentD);text-decoration:none;font-weight:600}
.paid-badge,.unpaid-badge,.photo-badge,.role-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.paid-badge{background:#e6f4ec;color:#2c7a54}
.unpaid-badge{background:#fcedec;color:var(--danger)}
.photo-badge{background:var(--soft);color:var(--accentD);margin-left:6px}
.role-badge{background:var(--soft);color:var(--accentD)}
.role-badge.role-admin{background:#fdf3e6;color:#a05c26}
.role-badge.role-manager{background:#eaf1fb;color:#3b5c8f}
.role-badge.role-master{background:#e8f4ee;color:#3a7a5a}
.role-badge.role-surveyor{background:#f0ebf8;color:#6a4b9a}
.corner-badge{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.corner-badge.paid{background:#e6f4ec;color:#2c7a54}
.corner-badge.unpaid{background:#fcedec;color:var(--danger)}
.thumb-aspect{width:70px;height:auto;min-height:50px;max-height:100px;border-radius:12px;border:1.5px solid var(--bd);object-fit:contain;background:#fff;cursor:pointer;flex-shrink:0}
.order-num{display:inline-block;background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-right:8px;font-family:var(--mono)}
.order-num-lg{display:inline-block;background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;padding:8px 18px;border-radius:12px;font-size:20px;font-weight:700;font-family:var(--mono)}
.summary{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:12px}
.summary .line{font-size:14px;font-weight:500}
.summary .breakdown{font-size:12px;opacity:.85;margin-top:6px}
.shower-builder{margin-top:16px;padding:14px;background:var(--soft);border-radius:16px}
.shower-builder-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--accentD);margin-bottom:10px}
.shower-total{font-size:12px;color:var(--accentD);background:var(--surface);padding:5px 12px;border-radius:999px}
.shower-actions{display:flex;gap:8px;margin-bottom:10px}
.shower-actions button{flex:1;padding:10px;border-radius:12px;border:1.5px dashed var(--accent);background:var(--surface);color:var(--accentD);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.shower-list{display:flex;flex-direction:column;gap:8px}
.shower-item{background:var(--surface);border-radius:12px;padding:12px;border:1.5px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.shower-item-head{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.shower-item-num{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.shower-item-type{flex:1;font-weight:600}
.shower-item-type.door{color:#c46b2c}
.shower-item-type.fixed{color:var(--accentD)}
.shower-item-del{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;padding:4px 8px}
.shower-item-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shower-item-field label{font-size:11px;color:var(--muted);display:block;margin:0 0 4px;font-weight:600;text-transform:uppercase}
.shower-item-field input,.shower-item-field select{padding:8px 10px;font-size:14px;border-radius:8px;margin-top:0}
.shower-item-field input:disabled{background:var(--soft);color:var(--muted)}
.shower-angle-chips{display:flex;gap:6px;margin-top:4px}
.shower-angle-chips button{flex:1;padding:6px 4px;font-size:11px;border-radius:8px;border:1.5px solid var(--bd);background:var(--surface);cursor:pointer;font-family:inherit;color:var(--soft2);font-weight:600}
.shower-angle-chips button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.shower-hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
.shower-empty{text-align:center;padding:16px;color:var(--muted);font-size:12px;background:var(--surface);border-radius:12px;border:1.5px dashed var(--accent)}
.mirror-niche-fields{margin-top:10px;padding:12px;background:#fdeced;border-radius:12px;border:1.5px solid #f5c8c8}
.mirror-glass-fields{margin-top:10px;padding:12px;background:var(--soft);border-radius:12px;border:1.5px solid var(--line)}
.mirror-fields-title{font-size:12px;font-weight:700;margin:0 0 8px;text-transform:uppercase}
.mirror-fields-title.red{color:#c14d4d}
.mirror-fields-title.blue{color:var(--accentD)}
.mirror-inset-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.mirror-inset-label{font-size:12px;color:#8a6a2c;font-weight:700}
.mirror-inset-custom{width:70px;padding:6px 8px;font-size:13px;border:1.5px solid var(--bd);border-radius:8px;text-align:center}
.mirror-zazor{font-size:12px;color:var(--muted);margin-top:8px}
.skew-block{margin-top:10px;padding:12px;background:#fdeced;border:1.5px solid #f5c8c8;border-radius:12px}
.mirror-ref-corner{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:160px;margin-top:4px}
.ref-corner-btn{width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface);border:1.5px solid var(--bd);font-size:22px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.ref-corner-btn.active{background:#dc2626;border-color:#c14d4d;color:#fff}
.photo-section{margin-top:16px;padding:14px;background:var(--soft);border-radius:16px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin:8px 0}
.photo-thumb-wrap{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1.5px solid var(--bd)}
.photo-thumb{width:100%;height:100%;object-fit:cover;cursor:pointer}
.photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(50,70,100,.75);color:#fff;border:none;font-size:12px;cursor:pointer}
.photo-strip{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.photo-strip-item{width:60px;height:60px;border-radius:10px;object-fit:cover;border:1.5px solid var(--bd);flex-shrink:0;cursor:pointer}
.fullscreen-img{position:fixed;inset:0;background:rgba(20,30,45,.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.fullscreen-img img{max-width:100%;max-height:100%;border-radius:14px}
.fullscreen-img .close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.95);border:none;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;color:#2a3547}
.auth-screen{position:fixed;inset:0;z-index:900;background:var(--bg1);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-inner{width:100%;max-width:380px}
.auth-logo{display:flex;justify-content:center;margin-bottom:20px}
.auth-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px}
.login-card{background:var(--surface);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:20px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--bd)}
.pin-dot.filled{background:var(--accent)}
.keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.key-btn{padding:16px;border-radius:14px;background:var(--soft);border:none;font-size:22px;font-weight:600;color:var(--accentD);font-family:inherit;cursor:pointer}
.key-btn.key-back{background:#f0f4fa;color:var(--soft2)}
.key-btn.key-enter{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;grid-column:1/-1;font-size:15px}
.pin-error{color:var(--danger);font-size:12px;text-align:center;font-weight:600;min-height:16px;margin-top:6px}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.role-btn{padding:12px 8px;border-radius:12px;border:1.5px solid var(--bd);background:var(--surface);cursor:pointer;font-family:inherit;color:var(--soft2);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.role-btn .rb-ico{font-size:20px}
.role-btn.active{border-color:var(--accent);background:var(--soft);color:var(--accentD)}
.tech-toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tech-toolbar button{flex:1;min-width:100px;padding:10px;border-radius:12px;border:none;background:var(--soft);color:var(--accentD);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.team-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.team-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--soft);border:none;font-size:12px;font-weight:500;color:var(--soft2);cursor:pointer;font-family:inherit}
.team-chip.active{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff}
.team-chip .tc-avatar{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accentD)}
.team-chip.active .tc-avatar{background:rgba(255,255,255,.9)}
.panno-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.panno-chip{padding:8px 4px;border-radius:12px;background:var(--surface);border:1.5px solid var(--bd);font-size:10px;cursor:pointer;color:var(--soft2);font-family:inherit;font-weight:500;text-align:center}
.panno-chip.active{border-color:var(--accent);background:var(--soft);color:var(--accentD)}
.electric-block{margin-top:12px}
.footer-brand{text-align:center;padding:20px;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.test-results{font-family:var(--mono);font-size:12px;padding:16px;background:linear-gradient(180deg,#1e2b3d,#0f172a);color:#e2e8f0;border-radius:14px;line-height:1.6;white-space:pre-wrap;max-height:60vh;overflow:auto}
.test-pass{color:#5ed18d}.test-fail{color:#f88;font-weight:700}
@media(max-width:420px){.container{padding:12px}.modal{padding:16px 14px 36px}.row3{grid-template-columns:1fr 1fr}.row3>div:nth-child(3){grid-column:1/-1}.panno-grid{grid-template-columns:repeat(3,1fr)}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(91,127,184,.2);border-radius:8px}
</style>
</head>
<body>
<div id="__err" style="display:none;position:fixed;top:0;left:0;right:0;background:#fee;color:#900;padding:10px;font:12px monospace;z-index:999999;white-space:pre-wrap;max-height:70vh;overflow:auto"></div>
<header>
<button id="backBtn" style="display:none" onclick="goBack()">←</button>
<div class="header-logo" id="headerLogo"></div>
<div class="header-user" id="headerUser" onclick="openProfile()"></div>
<button id="shareBtn" style="display:none" onclick="shareCurrentOrder()">↗</button>
<button id="logoutBtn" style="display:none" onclick="doLogout()">⏏</button>
<button id="settingsBtn" style="display:none" onclick="openSettings()">⚙️</button>
</header>
<div class="container" id="app"></div>
<div id="modalRoot"></div>
<script>
'use strict';
var DEBUG=/[?&](debug|test)=1/.test(location.search);
function __err(t){if(!DEBUG){try{console.warn(t);}catch(_){}return;}var el=document.getElementById('__err');if(el){el.style.display='block';el.textContent+=t+'\n';}}
window.addEventListener('error',function(e){__err('ERR: '+e.message+' @'+(e.lineno||'?'));});

async function importDB(file){if(!file)return;var ok=await uiConfirm('Импортировать?','Импорт',{danger:true,yesLabel:'Импорт'});if(!ok)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.orders))throw new Error('bad');db.orders=d.orders||[];db.items=d.items||[];if(d.users&&d.users.length)db.users=d.users;db.settings=d.settings||db.settings;db.nextOrder=Math.max.apply(null,[0].concat(db.orders.map(function(o){return o.id||0;}))) +1;db.nextItem=Math.max.apply(null,[0].concat(db.items.map(function(i){return i.id||0;}))) +1;db.nextUser=Math.max.apply(null,[0].concat(db.users.map(function(u){return u.id||0;}))) +1;db.items.forEach(migrateItem);db.orders.forEach(migrateOrder);db.users.forEach(migrateUser);save();closeModal();view='list';currentOrderId=null;render();uiAlert('Импортировано: '+db.orders.length);}catch(e){uiAlert('Ошибка импорта');}};r.readAsText(file);}

function renderAuth(){var ex=document.getElementById('authScreen');if(ex)ex.remove();var el=document.createElement('div');el.id='authScreen';el.className='auth-screen';var users=db.users.filter(function(u){return u.active;});var h='<div class="auth-inner"><div class="auth-logo">'+LOGO_FULL(90)+'</div><div class="auth-title">Вход в приложение</div><div class="auth-sub">Выберите пользователя и введите PIN</div><div class="login-card">';if(!users.length)h+='<div style="text-align:center;color:var(--muted)">Нет пользователей</div>';else{h+='<label>Пользователь</label><select id="authUser">'+users.map(function(u){return '<option value="'+u.id+'">'+esc(u.name)+' — '+(ROLE_META[u.role]?ROLE_META[u.role].label:u.role)+'</option>';}).join('')+'</select>';h+='<div class="pin-dots" id="pinDots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div><div class="pin-error" id="pinError"></div><div class="keypad" id="keypad">';for(var n=1;n<=9;n++)h+='<button class="key-btn" data-k="'+n+'">'+n+'</button>';h+='<button class="key-btn key-back" data-k="back">⌫</button><button class="key-btn" data-k="0">0</button><button class="key-btn key-back" data-k="clear">C</button><button class="key-btn key-enter" data-k="enter">Войти</button></div>';}h+='</div></div>';el.innerHTML=h;document.body.appendChild(el);var buf='';var dots=el.querySelectorAll('.pin-dot');function refresh(){dots.forEach(function(d,i){d.classList.toggle('filled',i<buf.length);});}function setErr(t){var e=el.querySelector('#pinError');if(e)e.textContent=t||'';}async function doLogin(){var sel=el.querySelector('#authUser');if(!sel)return;var uid=parseInt(sel.value,10);if(buf.length!==4){setErr('4 цифры');return;}var r=await login(uid,buf);if(!r.ok){setErr(r.reason||'Ошибка');buf='';refresh();return;}buf='';el.remove();if(r.mustChange)openChangePassword();else render();}function press(k){setErr('');if(k==='back'){buf=buf.slice(0,-1);refresh();return;}if(k==='clear'){buf='';refresh();return;}if(k==='enter'){doLogin();return;}if(/^\d$/.test(k)&&buf.length<4){buf+=k;refresh();if(buf.length===4)setTimeout(doLogin,150);}}el.querySelectorAll('.key-btn').forEach(function(b){b.onclick=function(){press(b.dataset.k);};});refresh();}
function applyTheme(m){var h=document.documentElement;if(m==='dark')h.setAttribute('data-theme','dark');else if(m==='light')h.setAttribute('data-theme','light');else h.setAttribute('data-theme',(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light');}
function getTheme(){try{return Storage.get('theme','auto');}catch(e){return 'auto';}}
function setTheme(m){try{Storage.set('theme',m);}catch(e){}applyTheme(m);}
(function(){try{var iconSvg='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" fill="#5b7fb8" rx="80"/><circle cx="256" cy="256" r="180" fill="#eaf1fb" stroke="#fff" stroke-width="10"/></svg>');var manifest={name:'Зерцало — Замеры',short_name:'Зерцало',start_url:'./',scope:'./',display:'standalone',orientation:'portrait',background_color:'#f6f8fc',theme_color:'#f6f8fc',lang:'ru',icons:[{src:iconSvg,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};var json=JSON.stringify(manifest),dataUrl='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(json);var link=document.getElementById('appManifest');if(link)link.href=dataUrl;}catch(e){}})();
(function(){if(!('serviceWorker' in navigator))return;if(location.protocol==='file:'||location.protocol==='content:')return;window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});})();
function boot(){applyTheme(getTheme());save();if(!isLoggedIn())renderAuth();else{if(!history.state)history.replaceState({view:'list'},'','#');render();}idbInit();}
boot();
