    if(i.plinthMount&&i.plinthHeight)R.push({k:'Плинтус',v:'H'+numFmt(i.plinthHeight)});

    if(i.isNiche)R.push({k:'В нишу',v:i.nicheDepth?('глубина '+numFmt(i.nicheDepth)+' мм'):'—'});

    if(i.socketsMount){var ss=socketSummary(i);R.push({k:'🔌 Розетки',v:ss||'—'});}
    if(i.lightsMount){var ls=lightsSummary(i);R.push({k:'💡 Светильники',v:ls||'—'});}

    if(i.cutV||i.cutH)R.push({k:'✂️ Разрез',v:cutSummary(i)});

    if(hasElectric(i)){

      var bl=backlightArr(i);

      if(bl.length)R.push({k:'⚡ Подсветка',v:bl.join(', ')});

      if(i.voltage)R.push({k:'⚡ Напряжение',v:i.voltage});

      if(i.switches&&i.switches.length)R.push({k:'⚡ Кнопка',v:i.switches.join(', ')});

      if(i.colorTemp)R.push({k:'⚡ Цв.темп.',v:i.colorTemp});

      if(i.trafo)R.push({k:'⚡ Трафо',v:i.trafo});

    }

    model.items.push(it);

  });

  return model;

}

function receiptClientRows(model){

  var c=model.client,rows=[];

  if(c.fullName)rows.push(['ФИО',c.fullName]);

  if(c.phone)rows.push(['Телефон',c.phone]);

  if(c.address)rows.push(['Адрес',c.address]);

  if(c.intercom)rows.push(['Домофон',c.intercom]);

  if(c.liftNeeded)rows.push(['Подъём',c.liftFloor>0?('на '+c.liftFloor+' этаж'):'нужен']);

  if(c.parkingCarry)rows.push(['Паркинг','Пронос']);

  if(c.needPass)rows.push(['Пропуск','⚠ Нужен']);

  return rows;

}

function receiptToText(model){

  var t='ЗЕРЦАЛО — замер\n\nЗаказ № '+model.orderNum+'\n',c=model.client;

  if(c.fullName)t+='Клиент: '+c.fullName+'\n';

  if(c.phone)t+='Телефон: '+c.phone+'\n';

  if(c.address)t+='Адрес: '+c.address+'\n';

  if(c.intercom)t+='Домофон: '+c.intercom+'\n';

  if(c.liftNeeded)t+='Подъём: '+(c.liftFloor>0?('на '+c.liftFloor+' этаж'):'нужен')+'\n';

  if(c.parkingCarry)t+='Пронос по паркингу\n';

  if(c.needPass)t+='⚠ Нужен пропуск\n';

  if(c.notes)t+='📝 '+c.notes+'\n';

  t+='Оплата: '+(c.paid?'✓ Оплачен':'не оплачен')+'\n\n';

  ITEM_TYPES.forEach(function(tp){

    var list=model.items.filter(function(it){return it.typeKey===tp.key;});

    if(!list.length)return;

    t+='◆ '+tp.label.toUpperCase()+'\n';

    list.forEach(function(it){

      t+='  — '+it.title+' ×'+it.qty+'\n';

      it.rows.forEach(function(r){if(r.k)t+='    — '+r.k+': '+r.v+'\n';else t+='    — '+r.v+'\n';});

      if(it.note)t+='    — 📝 '+it.note+'\n';

      t+='    — S='+it.area+' м², P='+it.perimeter+' м\n';

    });

    t+='\n';

  });

  return t+'— Зерцало';

}

function openPrintPreview(){

  var o=db.orders.find(function(x){return x.id===currentOrderId;});if(!o){uiAlert('Заказ не найден');return;}

  var items=itemsOf(o.id),model=buildReceiptModel(o,items),html=receiptToHTML(model);

  var w=window.open('','_blank');

  if(!w){uiAlert('Разрешите всплывающие окна.');return;}

  w.document.open();w.document.write(html);w.document.close();

}

async function shareCurrentOrder(){

  var o=db.orders.find(function(x){return x.id===currentOrderId;});if(!o)return;

  var items=itemsOf(o.id),model=buildReceiptModel(o,items),text=receiptToText(model);

  /* Сначала пробуем файлом (PDF/PNG) через navigator.share с files. */

  try{

    if(navigator.canShare&&typeof File!=='undefined'){

      var html=receiptToHTML(model);

      var blob=new Blob([html],{type:'text/html'});

      var file=new File([blob],'zerzalo-order-'+(o.orderNum||'x').replace(/[\/\\]/g,'-')+'.html',{type:'text/html'});

      if(navigator.canShare({files:[file]})){

        await navigator.share({files:[file],title:'Зерцало — заказ № '+(o.orderNum||''),text:text});

        return;

      }

    }

  }catch(e){if(e&&e.name==='AbortError')return;}

  /* Фallback — текст. */

  if(navigator.share){try{await navigator.share({title:'Зерцало — замер',text:text});return;}catch(e){if(e&&e.name==='AbortError')return;}}

  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){uiAlert('Текст скопирован');});

  else uiAlert(text);

}

function buildPhotoReportModel(o){

  var items=itemsOf(o.id);

  var rows=[];

  items.forEach(function(i,idx){

    if(!i.photos||!i.photos.length)return;

    i.photos.forEach(function(pid,pidx){

      rows.push({

        orderNum:o.orderNum||'—',

        itemIndex:idx+1,

        itemType:typeInfo(i.type).label,

        itemTitle:shapeLabel(i),

        qty:i.qty,

        photoIndex:pidx+1,

        photoTotal:i.photos.length,

        src:photoSrc(pid)

      });

    });

  });

  return {

    orderNum:o.orderNum||'—',

    date:new Date(o.createdAt),

    measureDate:o.measureDate||null,

    client:orderClientName(o),

    address:orderAddressFull(o),

    rows:rows,

    contacts:db.settings||{}

  };

}

function buildRouteSheetModel(route){

  var driver=route.assignedUserId?db.users.find(function(u){return u.id===route.assignedUserId;}):null;

  var rows=[];

  (route.points||[]).forEach(function(p,idx){

    var kind=routePointKindInfo(p.kind);

    var title='',address='',phone='';

    if(p.kind==='order'){

      var o=db.orders.find(function(x){return x.id===p.refId;});

      if(o){

        title='Заказ № '+(o.orderNum||'—')+' • '+(orderClientName(o)||'Без имени');

        var a=o.addressId?addressById(o.addressId):null;

        address=a?addressFull(a):(orderAddressFull(o)||'');

        phone=orderClientPhone(o)||'';

      }else{title='Заказ удалён';}

    }else if(p.kind==='contractor'){

      var co=contractorById(p.refId);

      if(co){

        title=co.name||'Контрагент';

        if(co.contactName)title+=' • '+co.contactName;

        var a2=co.addressId?addressById(co.addressId):null;

        address=a2?addressFull(a2):'';

        phone=co.phone||'';

      }else{title='Контрагент удалён';}

    }else{

      title=p.label||'Свободный адрес';

      var a3=p.addressId?addressById(p.addressId):null;

      address=a3?addressFull(a3):'';

    }

    if(p.note)title+=' — '+p.note;

    rows.push({

      num:idx+1,

      time:p.time||'',

      kindIco:kind.ico,

      kindLabel:kind.label,

      title:title,

      address:address,

      phone:phone

    });

  });

  var dateLabel='';

  if(route.date){var d=ymdToDate(route.date);dateLabel=d?(d.getDate()+' '+monthNameRuGen(d.getMonth())+' '+d.getFullYear()):route.date;}

  return {

    title:route.title||'Маршрут',

    date:dateLabel,

    driver:driver?(driver.name+' ('+(ROLE_META[driver.role]?ROLE_META[driver.role].label:driver.role)+')'):'—',

    note:route.note||'',

    rows:rows,

    contacts:db.settings||{}

  };

}

function routeSheetToText(model){

  var t='ЗЕРЦАЛО — маршрутный лист\n\n'+model.title+'\n';

  if(model.date)t+='Дата: '+model.date+'\n';

  if(model.driver)t+='Водитель: '+model.driver+'\n';

  if(model.note)t+='Заметка: '+model.note+'\n';

  t+='\n';

  model.rows.forEach(function(r){

    t+=r.num+'. '+r.kindIco+' '+r.kindLabel+(r.time?(' ('+r.time+')'):'')+'\n';

    t+='   '+r.title+'\n';

    if(r.address)t+='   📍 '+r.address+'\n';

    if(r.phone)t+='   📞 '+r.phone+'\n';

    t+='\n';

  });

  return t+'— Зерцало';

}

async function exportDB(){

  var ids={};(db.items||[]).forEach(function(i){

    if(Array.isArray(i.photos))i.photos.forEach(function(p){if(typeof p==='string'&&p.indexOf('data:')!==0)ids[p]=1;});

    if(i.drawingIsoId)ids[i.drawingIsoId]=1;if(i.drawingFrontId)ids[i.drawingFrontId]=1;

  });

  var idList=Object.keys(ids);

  for(var k=0;k<idList.length;k++){var id=idList[k];if(!photoCache[id]&&!drawingCache[id]){try{var d=await idbGetPhoto(id);if(d){photoCache[id]=d;drawingCache[id]=d;}}catch(e){}}}

  var exportDb=JSON.parse(JSON.stringify(db));

  exportDb.items=(exportDb.items||[]).map(function(i){

    var r=JSON.parse(JSON.stringify(i));

    if(Array.isArray(r.photos))r.photos=r.photos.map(function(p){if(!p)return '';if(typeof p==='string'&&p.indexOf('data:')===0)return p;return photoCache[p]||'';}).filter(Boolean);

    if(r.drawingIsoId&&drawingCache[r.drawingIsoId])r.drawingIso=drawingCache[r.drawingIsoId];

    if(r.drawingFrontId&&drawingCache[r.drawingFrontId])r.drawingFront=drawingCache[r.drawingFrontId];

    r.drawingIsoId=null;r.drawingFrontId=null;

    return r;

  });

  var data=JSON.stringify(exportDb,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob);

  var a=document.createElement('a');a.href=url;a.download='zerzalo-backup-'+new Date().toISOString().slice(0,10)+'.json';

  document.body.appendChild(a);a.click();a.remove();

  setTimeout(function(){URL.revokeObjectURL(url);},1000);

}

async function importDB(file){

  if(!file)return;

  var ok=await uiConfirm('Импортировать данные?','Импорт',{danger:true,yesLabel:'Импортировать'});if(!ok)return;

  var r=new FileReader();

  r.onload=function(){

    try{

      var d=JSON.parse(r.result);

      if(!d||!Array.isArray(d.orders)||!Array.isArray(d.items))throw new Error('bad');

      db.orders=d.orders;db.items=d.items;db.settings=d.settings||db.settings;

      if(Array.isArray(d.users)&&d.users.length)db.users=d.users;

      if(Array.isArray(d.clients))db.clients=d.clients;

      if(Array.isArray(d.addresses))db.addresses=d.addresses;

      if(Array.isArray(d.events))db.events=d.events;

      if(Array.isArray(d.contractors))db.contractors=d.contractors;

      if(Array.isArray(d.routes))db.routes=d.routes;

      if(Array.isArray(d.notifications))db.notifications=d.notifications;

      if(d.roles&&typeof d.roles==='object')db.roles=d.roles;

      /* ВАЖНО: не трогаем локальный db.sync — там токен и состояние синхронизации этого устройства. */

      if(d.settings&&d.settings.prices&&typeof d.settings.prices==='object')db.settings.prices=d.settings.prices;

      db.nextOrder=Math.max.apply(null,[0].concat(db.orders.map(function(o){return o.id||0;}))) +1;

      db.nextItem=Math.max.apply(null,[0].concat(db.items.map(function(i){return i.id||0;}))) +1;

      db.nextUser=Math.max.apply(null,[0].concat(db.users.map(function(u){return u.id||0;}))) +1;

      db.nextClient=Math.max.apply(null,[0].concat(db.clients.map(function(c){return c.id||0;}))) +1;

      db.nextAddress=Math.max.apply(null,[0].concat(db.addresses.map(function(a){return a.id||0;}))) +1;

      db.nextEvent=Math.max.apply(null,[0].concat(db.events.map(function(e){return e.id||0;}))) +1;

      db.nextContractor=Math.max.apply(null,[0].concat(db.contractors.map(function(c){return c.id||0;}))) +1;

      db.nextRoute=Math.max.apply(null,[0].concat(db.routes.map(function(r){return r.id||0;}))) +1;

      db.nextNotification=Math.max.apply(null,[0].concat(db.notifications.map(function(n){return n.id||0;}))) +1;

      db.items.forEach(migrateItem);db.orders.forEach(migrateOrder);db.users.forEach(migrateUser);

      db.clients.forEach(migrateClient);db.addresses.forEach(migrateAddress);db.events.forEach(migrateEvent);db.contractors.forEach(migrateContractor);db.routes.forEach(migrateRoute);

      db.notifications.forEach(migrateNotification);

      touchAllEntities();

      var days={};db.orders.forEach(function(o){var kk=orderDateKey(o);if(kk)days[kk]=1;});

      Object.keys(days).forEach(renumberDayOrders);

      save();closeModal();goBack();uiAlert('✔ Импортировано: '+db.orders.length);

    }catch(e){uiAlert('❌ Ошибка импорта');}

  };

  r.readAsText(file);

}

function trashEntryTitle(entry){

  if(entry.type==='order'){

    var o=entry.order||{};

    return 'Заказ № '+(o.orderNum||'—')+' • '+([o.lastName,o.firstName].filter(Boolean).join(' ')||(o.snapshot&&o.snapshot.clientName)||'Без имени');

  }

  if(entry.type==='item'){

    var it=entry.item||{};

    return 'Позиция: '+typeInfo(it.type).label+' ×'+(it.qty||1);

  }

  return 'Запись';

}

function trashEntrySub(entry){

  var dt=new Date(entry.deletedAt||Date.now());

  var u=entry.deletedBy?db.users.find(function(x){return x.id===entry.deletedBy;}):null;

  var parts=[dt.toLocaleString('ru-RU')];

  if(u)parts.push('кто: '+u.name);

  if(entry.type==='order'&&Array.isArray(entry.items))parts.push('позиций: '+entry.items.length);

  return parts.join(' • ');

}

var _reportsPeriod={from:'',to:'',preset:'30d'};

function reportsDateRange(){

  var today=new Date();

  var from=null,to=null;

  if(_reportsPeriod.from&&_reportsPeriod.to){

    from=_reportsPeriod.from;to=_reportsPeriod.to;

  }else{

    var toD=new Date(today.getFullYear(),today.getMonth(),today.getDate());

    var fromD=new Date(toD.getTime());

    var preset=_reportsPeriod.preset||'30d';

    if(preset==='7d')fromD.setDate(fromD.getDate()-6);

    else if(preset==='30d')fromD.setDate(fromD.getDate()-29);

    else if(preset==='month'){fromD=new Date(toD.getFullYear(),toD.getMonth(),1);}

    else if(preset==='year'){fromD=new Date(toD.getFullYear(),0,1);}

    else if(preset==='all'){fromD=new Date(2000,0,1);}

    from=dateToYmd(fromD);to=dateToYmd(toD);

  }

  return {from:from,to:to};

}

function setReportsPreset(preset){_reportsPeriod.preset=preset;_reportsPeriod.from='';_reportsPeriod.to='';renderReportsBody();}

function setReportsCustomDate(which,v){

  if(which==='from')_reportsPeriod.from=v||'';

  else _reportsPeriod.to=v||'';

  _reportsPeriod.preset='custom';

  renderReportsBody();

}

function openReports(){

  if(!canViewReports()){uiAlert('Нет прав');return;}

  renderReportsBody();

}

function renderReportsBody(){

  var rg=reportsDateRange();

  var orders=visibleOrders().filter(function(o){

    var k=orderDateKey(o);

    if(!k)return false;

    return k>=rg.from&&k<=rg.to;

  });

  var byStatus={new:0,work:0,ready:0,installed:0,cancelled:0};

  orders.forEach(function(o){byStatus[o.status]=(byStatus[o.status]||0)+1;});

  var area=0,itemsCount=0,revenue=0,paidCount=0,dueTotal=0;

  orders.forEach(function(o){

    var items=itemsOf(o.id);

    itemsCount+=items.length;

    items.forEach(function(i){area+=calcArea(i)*i.qty;});

    var _t=Number(o.orderTotal)||0,_p=Number(o.orderPaid)||0;

    revenue+=_p;

    dueTotal+=Math.max(0,_t-_p);

    if(_t>0&&_p>=_t)paidCount++;

  });

  /* Загрузка пользователей. */

  var workByUser={};

  orders.forEach(function(o){

    var t=Array.isArray(o.assignedUserIds)?o.assignedUserIds:[];

    t.forEach(function(uid){workByUser[uid]=(workByUser[uid]||0)+1;});

  });

  var byType={};

  orders.forEach(function(o){

    itemsOf(o.id).forEach(function(i){

      byType[i.type]=(byType[i.type]||0)+i.qty;

/* ============ СИНХРОНИЗАЦИЯ ЧЕРЕЗ FIREBASE REALTIME DATABASE ============

   Вся база хранится в одной ветке: zerzalo/ (корень — объект со всеми полями).

   Каждое изменение на любом устройстве появляется у всех остальных в течение ~1 сек.

   Ручные кнопки pull/push не нужны — данные уходят сами.

   ==================================================== */



/* === Конфиг Firebase (публичный, не секретный — доступ защищён правилами базы) === */

var firebaseConfig = {

  apiKey: "AIzaSyD68sZPnMDDSuvogZUi2KzJvtYYAOfKjfw",

  authDomain: "zercalo-673ed.firebaseapp.com",

  databaseURL: "https://zercalo-673ed-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "zercalo-673ed",

  storageBucket: "zercalo-673ed.firebasestorage.app",

  messagingSenderId: "1007857092023",

  appId: "1:1007857092023:web:67bf468565dd8f0be89432"

};



/* === Состояние === */

var _fbApp = null;              // firebase app

var _fbDbRef = null;            // ref на корень ветки 'zerzalo'

var _fbApplyingRemote = false;  // флаг: сейчас применяем данные из Firebase (не запускать push)

var _fbPushTimer = null;        // дебаунс push

var _fbLastPushedAt = 0;        // время последнего set() — чтобы отсекать эхо от своего же push



/* === Сборка данных для отправки в Firebase. === */

function buildSyncPayload(){

  return {

    schemaVersion:SCHEMA_VERSION,

    exportedAt:Date.now(),

    deviceId:db.sync?db.sync.deviceId:'',

    orders:db.orders,

    items:db.items,

    users:db.users,

    clients:db.clients,

    addresses:db.addresses,

    events:db.events,

    contractors:db.contractors,

    routes:db.routes,

    notifications:db.notifications,

    roles:db.roles,

    settings:db.settings,

    trash:[],

    nextOrder:db.nextOrder,nextItem:db.nextItem,nextUser:db.nextUser,

    nextClient:db.nextClient,nextAddress:db.nextAddress,nextEvent:db.nextEvent,

    nextContractor:db.nextContractor,nextRoute:db.nextRoute,nextNotification:db.nextNotification

  };

}

/* === Merge локальных и удалённых данных по updatedAt (last-write-wins). === */

function mergeEntityArray(localArr,remoteArr,idKey){

  idKey=idKey||'id';

  var result={};

  (localArr||[]).forEach(function(o){if(o&&o[idKey]!=null)result[o[idKey]]={src:'local',obj:o};});

  (remoteArr||[]).forEach(function(ro){

    if(!ro||ro[idKey]==null)return;

    var lid=ro[idKey];

    var entry=result[lid];

    if(!entry){result[lid]={src:'remote',obj:ro};return;}

    var local=entry.obj,remote=ro;

    var lU=Number(local.updatedAt)||Number(local.createdAt)||0;

    var rU=Number(remote.updatedAt)||Number(remote.createdAt)||0;

    if(rU>lU)result[lid]={src:'remote',obj:remote};

  });

  var out=[];

  Object.keys(result).forEach(function(k){out.push(result[k].obj);});

  return out;

}

/* === Применить merge к массиву в db. === */

function applyMergedArray(arrName,remoteArr,idKey){

  if(!Array.isArray(remoteArr))return;

  db[arrName]=mergeEntityArray(db[arrName]||[],remoteArr,idKey||'id');

}

/* === Общий вход: применяем данные из Firebase к локальной базе. === */

function applySyncPayload(remote){

  if(!remote||typeof remote!=='object')return;

  applyMergedArray('orders',remote.orders);

  applyMergedArray('items',remote.items);

  applyMergedArray('users',remote.users);

  applyMergedArray('clients',remote.clients);

  applyMergedArray('addresses',remote.addresses);

  applyMergedArray('events',remote.events);

  applyMergedArray('contractors',remote.contractors);

  applyMergedArray('routes',remote.routes);

  applyMergedArray('notifications',remote.notifications);

  if(remote.settings){

    var localS=Number(db.settings&&db.settings.updatedAt)||0;

    var remoteS=Number(remote.settings.updatedAt)||remote.exportedAt||0;

    if(remoteS>localS)db.settings=Object.assign({},db.settings,remote.settings);

  }

  if(remote.roles&&typeof remote.roles==='object'){

    if(!db.roles||typeof db.roles!=='object')db.roles={};

    Object.keys(remote.roles).forEach(function(roleKey){

      var remoteRole=remote.roles[roleKey];

      if(!remoteRole||typeof remoteRole!=='object')return;

      var localRole=db.roles[roleKey];

      if(!localRole||typeof localRole!=='object'){db.roles[roleKey]=Object.assign({},remoteRole);return;}

      var lU=Number(localRole.updatedAt)||0;

      var rU=Number(remoteRole.updatedAt)||0;

      if(rU>lU)db.roles[roleKey]=Object.assign({},remoteRole);

    });

  }

  ['nextOrder','nextItem','nextUser','nextClient','nextAddress','nextEvent','nextContractor','nextRoute','nextNotification'].forEach(function(k){

    var lv=Number(db[k])||1,rv=Number(remote[k])||1;

    db[k]=Math.max(lv,rv);

  });

  (db.orders||[]).forEach(migrateOrder);

  (db.items||[]).forEach(migrateItem);

  (db.users||[]).forEach(migrateUser);

  (db.clients||[]).forEach(migrateClient);

  (db.addresses||[]).forEach(migrateAddress);

  (db.events||[]).forEach(migrateEvent);

  (db.contractors||[]).forEach(migrateContractor);

  (db.routes||[]).forEach(migrateRoute);

  (db.notifications||[]).forEach(migrateNotification);

  touchAllEntities();

}

/* === Инициализация. Вызывается при boot() и в панели синхронизации. === */



function syncEnsureDefaults(){

  if(!db.sync)db.sync={};

  if(!db.sync.deviceId)db.sync.deviceId='dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);

  if(!db.sync.status)db.sync.status='off';

  if(db.sync.enabled==null)db.sync.enabled=true;



  if(db.sync.enabled&&!_fbApp){

    try{

      _fbApp=firebase.initializeApp(firebaseConfig);

      initFirebaseAuth();

      initAppCheck();

      _fbDbRef=firebase.database().ref('zerzalo');

      _fbSubscribe();

      db.sync.status='idle';

      db.sync.lastError='';

      /* При самом первом запуске (lastPushAt=0) отправляем свою локальную базу в Firebase. */

      if(!db.sync.lastPushAt){
        setTimeout(function(){
          _fbDbRef.once('value').then(function(snap){
            var remote=snap.val();
            if(remote){
              _fbApplyingRemote=true;
              try{applySyncPayload(remote);}finally{setTimeout(function(){_fbApplyingRemote=false;},300);}
              db.sync.lastPullAt=Date.now();
              save();
            }
            return fbPushAll();
          }).catch(function(){fbPushAll().catch(function(){});});
        },1500);
      }

    }catch(e){

      db.sync.status='error';

      db.sync.lastError=String((e&&e.message)||e);

    }

  }

  return db.sync;

}



/* === Реалтайм-подписка. Срабатывает при каждом изменении ветки 'zerzalo'. === */

function _fbSubscribe(){

  if(!_fbDbRef)return;

  _fbDbRef.on('value',function(snap){

    /* Если это эхо нашего же push — игнорируем. */

    if(Date.now()-_fbLastPushedAt<800)return;

    var remote=snap.val();

    if(!remote)return;

    _fbApplyingRemote=true;

    try{

      applySyncPayload(remote);
      db.sync.lastPullAt=Date.now();
      save();
      var _mOpen=!!document.querySelector('.modal-bg');
      if(_mOpen){window._pendingRender=true;}
      else if(typeof render==='function'){try{render();}catch(e){__showErr('[sync] '+(e.message||e));}}
    }finally{
      setTimeout(function(){ _fbApplyingRemote=false; },300);
    }
  },function(err){

    db.sync.status='error';

    db.sync.lastError=String((err&&err.message)||err);

    updateSyncDot();

  });

}



/* === Полная отправка всей базы в Firebase. === */

function fbPushAll(){

  if(!_fbDbRef)return Promise.reject(new Error('Firebase не инициализирован'));

  if(!isOnline())return Promise.reject(new Error('Нет интернета'));

  var payload=buildSyncPayload();

  _fbLastPushedAt=Date.now();

  return _fbDbRef.set(payload).then(function(){

    db.sync.lastPushAt=Date.now();

    db.sync.status='idle';

    db.sync.lastError='';

    updateSyncDot();

  }).catch(function(e){

    db.sync.status='error';

    db.sync.lastError=String((e&&e.message)||e);

    updateSyncDot();

    throw e;

  });

}



/* === Дебаунс-отправка. Вызывается из save() при каждом изменении базы. === */

function schedulePush(){

  if(_fbApplyingRemote)return;

  if(!db.sync||!db.sync.enabled)return;

  if(!_fbDbRef)return;

  if(!isOnline())return;

  clearTimeout(_fbPushTimer);

  _fbPushTimer=setTimeout(function(){ fbPushAll().catch(function(){}); },1500);

}



/* === Подстраховочное чтение при возврате фокуса/интернета (не чаще раза в минуту). === */

function schedulePull(){

  if(!_fbDbRef)return;

  if(!isOnline())return;

  if(Date.now()-(db.sync.lastPullAt||0)<60000)return;

  _fbDbRef.once('value').then(function(snap){

    if(Date.now()-_fbLastPushedAt<800)return;

    var remote=snap.val();

    if(!remote)return;

    _fbApplyingRemote=true;

    try{

      applySyncPayload(remote);

      db.sync.lastPullAt=Date.now();

      save();

/* === «Синхронизировать сейчас» — pull + push. === */

function syncNow(){

  syncEnsureDefaults();

  if(!db.sync.enabled){uiAlert('Синхронизация выключена');return Promise.resolve();}

  if(!isOnline()){uiAlert('Нет интернета');return Promise.resolve();}

  if(!_fbDbRef){uiAlert('Firebase не инициализирован');return Promise.resolve();}

  db.sync.status='syncing';updateSyncDot();

  return _fbDbRef.once('value').then(function(snap){

    if(Date.now()-_fbLastPushedAt>=800){

      var remote=snap.val();

      if(remote){

        _fbApplyingRemote=true;

        try{applySyncPayload(remote);}finally{setTimeout(function(){ _fbApplyingRemote=false; },300);}

      }

    }

    return fbPushAll();

  }).then(function(){

    db.sync.status='idle';

    updateSyncDot();

  }).catch(function(e){

    db.sync.status='error';

    db.sync.lastError=String((e&&e.message)||e);

    updateSyncDot();

    throw e;

  });

}

/* === v2.1.15: безопасность Firebase (Anonymous Auth + App Check) === */

function initFirebaseAuth(){

  try{

    if(!window.firebase||typeof firebase.auth!=='function')return;

    var auth=firebase.auth();

    auth.onAuthStateChanged(function(user){

      if(user){

        db.sync=db.sync||{};

        db.sync.authUid=user.uid;

        db.sync.authStatus='signed';

      }else{

        db.sync=db.sync||{};

        db.sync.authStatus='none';

      }

      if(typeof updateSyncDot==='function')updateSyncDot();

    });

    if(!auth.currentUser){

      auth.signInAnonymously().catch(function(e){

        db.sync=db.sync||{};

        db.sync.authStatus='error';

        db.sync.authError=String((e&&e.message)||e);

        try{console.warn('[auth] signInAnonymously',e);}catch(_){}

      });

    }else{

      db.sync=db.sync||{};

      db.sync.authStatus='signed';

      db.sync.authUid=auth.currentUser.uid;

    }

  }catch(e){

    db.sync=db.sync||{};

    db.sync.authStatus='error';

    db.sync.authError=String((e&&e.message)||e);

  }

}

function initAppCheck(){

  try{

    if(!window.firebase||typeof firebase.appCheck!=='function')return;

    var key=(db.settings&&db.settings.appCheckSiteKey)||'';

    if(!key){

      db.sync=db.sync||{};

      db.sync.acStatus='nokey';

      return;

    }

    var provider=null;

    try{

      if(firebase.appCheck.ReCaptchaV3Provider){

        provider=new firebase.appCheck.ReCaptchaV3Provider(key);

      }

    }catch(e){}

    if(provider){firebase.appCheck().activate(provider,true);}

    else{firebase.appCheck().activate(key,true);}

    db.sync=db.sync||{};

    db.sync.acStatus='active';

    db.sync.acError='';

  }catch(e){

    db.sync=db.sync||{};

    db.sync.acStatus='error';

    db.sync.acError=String((e&&e.message)||e);

    try{console.warn('[appcheck] activate',e);}catch(_){}

  }

}

function firebaseSecurityStatus(){

  var aOk=(db.sync&&db.sync.authStatus==='signed');

  var aTxt=aOk?('✅ Вход выполнен (UID '+String(db.sync.authUid||'').slice(0,8)+'…)'):((db.sync&&db.sync.authStatus==='error')?('❌ Ошибка: '+(db.sync.authError||'неизвестно')):'⚪️ Не выполнен');

  var k=(db.settings&&db.settings.appCheckSiteKey)||'';

  var cOk=(db.sync&&db.sync.acStatus==='active');

  var cTxt=cOk?'✅ Активен':(k?('⚠ Ошибка: '+(db.sync&&db.sync.acError||'не инициализирован')):'⚪️ Не задан ключ reCAPTCHA (опционально)');

  return {authOk:aOk,authTxt:aTxt,acOk:cOk,acTxt:cTxt,key:k};

}

/* Расчёт ориентировочной стоимости заказа. */

function computeOrderPrice(o,items){

  if(!db.settings||!db.settings.prices)return null;

  var p=db.settings.prices;

  var hasAny=(p.mirrorM2||p.glassM2||p.edgeM||p.electroEach);

  if(!hasAny)return null;

  var total=0,areaM=0,areaG=0,edge=0,elec=0;

  items.forEach(function(i){

    var a=calcArea(i)*i.qty;

    if(i.type==='MIRROR')areaM+=a;else areaG+=a;

    edge+=calcPerim(i)*i.qty;

    if(hasElectric(i))elec+=i.qty;

  });

  total=areaM*(p.mirrorM2||0)+areaG*(p.glassM2||0)+edge*(p.edgeM||0)+elec*(p.electroEach||0);

  return {total:Math.round(total),areaM:areaM,areaG:areaG,edge:edge,elec:elec};

}

var _tsGroups=[];

function _tsEnsureGroup(name){

  var g=_tsGroups.find(function(x){return x.name===name;});

  if(!g){g={name:name,ico:_tsGroupIco(name),tests:[]};_tsGroups.push(g);}

  return g;

}

function _tsGroupIco(name){

  return ({

    Geometry:'📐',Dates:'📅',Permissions:'🔐',Notifications:'🔔',

    Sync:'☁️',CRUD:'🗂',Filters:'🎛',UI:'🖥',Legacy:'🕰'

  })[name]||'⚙️';

}

function _tsRegister(group,name,fn){

  _tsEnsureGroup(group).tests.push({name:name,fn:fn});

}

function _tsSandbox(fn){

  var realDb=db,realEdit=window._editDraft,realOrder=currentOrderId;

  try{

    db=JSON.parse(JSON.stringify(realDb));

    return fn();

  } finally {

    db=realDb;

    window._editDraft=realEdit;

    currentOrderId=realOrder;

  }

}

function _tsEq(a,b,eps){

  if(eps!=null)return Math.abs(a-b)<=eps;

  return a===b;

}

function _tsRunAll(){

  var results=[];

  _tsGroups.forEach(function(g){

    g.tests.forEach(function(t){

      var t0=Date.now();

      var res;

      try{

        var r=t.fn();

        if(r===true||r===undefined)res={ok:true};

        else if(r===false)res={ok:false,msg:'вернул false'};

        else if(r&&typeof r==='object'&&typeof r.ok==='boolean')res={ok:r.ok,msg:r.msg||''};

        else res={ok:!!r};

      }catch(e){

        res={ok:false,msg:String((e&&e.message)||e)};

      }

      results.push({group:g.name,ico:g.ico,name:t.name,ok:res.ok,msg:res.msg||'',ms:Date.now()-t0});

    });

  });

  return results;

}

function _tsEscape(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function _tsShowReport(results,filter){

  var passed=results.filter(function(r){return r.ok;}).length;

  var total=results.length;

  var shown=filter==='failed'?results.filter(function(r){return !r.ok;}):results;

  var color=passed===total?'#2c7a54':(passed/total>0.8?'#a05c26':'#c14d4d');

  var html='<h2>'+LOGO_MARK(30)+' Тестовый стенд</h2>';

  html+='<div style="display:flex;gap:8px;align-items:center;margin:8px 0 12px;font-size:13px;color:var(--muted)">';

  html+='<span style="font-weight:800;font-size:22px;color:'+color+'">'+passed+' / '+total+'</span>';

  html+='<span>· '+new Date().toLocaleTimeString('ru-RU')+'</span>';

  html+='</div>';

  html+='<div class="chips" style="margin-bottom:10px">';

  html+='<button type="button" class="chip '+(filter!=='failed'?'active':'')+'" onclick="window._tsLastFilter=\'all\';runTestStand()">Все</button>';

  html+='<button type="button" class="chip '+(filter==='failed'?'active':'')+'" onclick="window._tsLastFilter=\'failed\';runTestStand()">Только упавшие ('+results.filter(function(r){return !r.ok;}).length+')</button>';

  html+='</div>';

  if(!shown.length){

    html+='<div class="empty" style="padding:20px;font-size:13px">Ничего не найдено.</div>';

  } else {

    var byGroup={};

    shown.forEach(function(r){if(!byGroup[r.group])byGroup[r.group]=[];byGroup[r.group].push(r);});

    Object.keys(byGroup).forEach(function(gname){

      var arr=byGroup[gname];

      var gPass=arr.filter(function(r){return r.ok;}).length;

      html+='<div style="margin-top:14px"><div style="font-size:12px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">'+arr[0].ico+' '+_tsEscape(gname)+' <span style="color:'+(gPass===arr.length?'#2c7a54':'#c14d4d')+'">('+gPass+'/'+arr.length+')</span></div>';

      arr.forEach(function(r){

        var c=r.ok?'test-pass':'test-fail';

        html+='<div class="'+c+'" style="padding:3px 0;font-size:13px;font-family:ui-monospace,Menlo,monospace">'+(r.ok?'✓':'✗')+' '+_tsEscape(r.name)+(r.msg?' — '+_tsEscape(r.msg):'')+(r.ms>4?' <span style="color:#8894a9">('+r.ms+'мс)</span>':'')+'</div>';

      });

      html+='</div>';

    });

  }

  html+='<button class="btn btn-primary" onclick="runTestStand()">🔁 Прогнать заново</button>';

  html+='<button class="btn btn-secondary" onclick="copyTestReport()">📋 Скопировать отчёт</button>';

  html+='<button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>';

  showModal(html);

  window._tsLastResults=results;

}

function runTestStand(){

  var results=_tsRunAll();

  var filter=window._tsLastFilter||'all';

  _tsShowReport(results,filter);

}

function copyTestReport(){

  var results=window._tsLastResults||[];

  var passed=results.filter(function(r){return r.ok;}).length;

  var txt='Zerzalo test stand — '+new Date().toISOString()+'\n'+passed+'/'+results.length+' passed\n\n';

  results.forEach(function(r){txt+=(r.ok?'✓':'✗')+' ['+r.group+'] '+r.name+(r.msg?' — '+r.msg:'')+'\n';});

  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){uiAlert('Отчёт скопирован в буфер обмена.');});

  else uiAlert(txt);

}

/* === Открытие тестового стенда === */

function openTestStand(){

  var u=currentUser();

  var isAdmin=u&&u.role==='admin';

  if(!DEBUG_MODE&&!isAdmin){

    uiAlert('Тестовый стенд доступен только администратору или в режиме ?debug=1.');

    return;

  }

  runTestStand();

}



function boot(){

  applyTheme(getSavedTheme());

  if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(getSavedTheme()==='auto')applyTheme('auto');});}catch(e){}}

  syncEnsureDefaults();

  save();

  if(!isLoggedIn())renderAuth();

  else{try{if(!history.state)history.replaceState({view:'list'},'','#');render();}catch(e){__showErr('[render] '+(e.message||e));}}

  initFabAutoHide();

  initOnlineWatcher();

  initSyncWatcher();

  initMorningDigest();

  updateOnlineIndicator();

  if(/[?&]test=1/.test(location.search))setTimeout(function(){runSelfTests();},300);

  idbInit().then(function(){if(!idb)return;gcOrphanBlobs().catch(function(){});}).catch(function(){});

  /* Автопулл при старте, если синхронизация включена. */

  if(db.sync&&db.sync.enabled&&isOnline()){

    setTimeout(function(){schedulePull();},1200);

  }

}



/* ============ САМОТЕСТЫ ============ */

function selfTests(){

  var r=[];

  function ok(n,c,e){r.push({name:n,pass:!!c,extra:e||''});}

  function eq(n,a,b,t){var p=(t!=null)?Math.abs(a-b)<=t:a===b;ok(n,p,p?'':'получено '+a+', ожидалось '+b);}

  eq('Площадь RECT 100×50 → 0.5',calcArea({type:'MIRROR',shape:'RECT',w:100,h:50}),0.5,0.0001);

  var g=getMirrorNicheAndGlass({type:'MIRROR',shape:'RECT',mirrorMeasureMode:'niche',mirrorInset:1.5,T:100,B:100,L:50,R:50});

  eq('Ниша: стекло В = 99.7',g.glass.T,99.7,0.0001);

  var z=mirrorBothZazor({type:'MIRROR',shape:'RECT',mirrorMeasureMode:'both',T:100,B:100,L:50,R:50,w:99,h:49});

  eq('Both: зазор 0.5',z.wTop,0.5,0.0001);

  ok('validateOrderNum 15/03',validateOrderNum('15/03').ok===true);

  ok('validateOrderNum 32/01',validateOrderNum('32/01').ok===false);

  var sk=analyzeNicheSkew({T:358,B:353.1,L:54,R:54.1});

  ok('analyzeNicheSkew top_wide',sk.vertical==='top_wide');

  ok('PERMISSIONS непустой',Object.keys(PERMISSIONS).length>0);

  ok('ROLE_DEFAULTS содержит admin',!!ROLE_DEFAULTS.admin);

  ok('userCan доступен',typeof userCan==='function');

  ok('touch ставит updatedAt',(function(){var o={};touch(o);return typeof o.updatedAt==='number'&&o.updatedAt>0;})());

  ok('touch не ломает null',(function(){try{touch(null);return true;}catch(e){return false;}})());

  ok('createNotification работает',(function(){

    var before=db.notifications.length;

    var n=createNotification({userId:999,type:'info',title:'t',body:'b'});

    var okk=!!n&&db.notifications.length===before+1;

    if(n)db.notifications.pop();

    return okk;

  })());

  ok('unreadNotificationsCount доступен',typeof unreadNotificationsCount==='function');

  ok('buildSyncPayload возвращает объект',typeof buildSyncPayload()==='object');

  ok('mergeEntityArray LWW',(function(){

    var loc=[{id:1,v:'L',updatedAt:100}];

    var rem=[{id:1,v:'R',updatedAt:200}];

    var out=mergeEntityArray(loc,rem);

    return out.length===1&&out[0].v==='R';

  })());

  ok('computeOrderPrice без прайса → null',(function(){var s=db.settings.prices;db.settings.prices={};var r=computeOrderPrice({},[]);db.settings.prices=s;return r===null;})());

  ok('Firebase config задан',typeof firebaseConfig==='object'&&!!firebaseConfig.databaseURL);

  return r;

}

function runSelfTests(){

  var results=selfTests(),passed=results.filter(function(r){return r.pass;}).length,total=results.length;

  var html='<h2>🧪 Самотесты</h2><div style="font-size:13px;color:#8894a9;margin-bottom:12px">Пройдено: <b style="color:'+(passed===total?'#2c7a54':'#c14d4d')+'">'+passed+' / '+total+'</b></div>';

  html+='<div class="test-results">'+results.map(function(r){return '<div class="'+(r.pass?'test-pass':'test-fail')+'">'+(r.pass?'✓':'✗')+' '+esc(r.name)+(r.extra?' — '+esc(r.extra):'')+'</div>';}).join('')+'</div>';

  html+='<button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>';

  showModal(html);

}



boot();
