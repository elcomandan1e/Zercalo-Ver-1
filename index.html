var _reportsPeriod={from:'',to:'',preset:'30d'};
function reportsDateRange(){
  var today=new Date();
  var from=null,to=null;
  if(_reportsPeriod.from&&_reportsPeriod.to){
    from=_reportsPeriod.from;to=_reportsPeriod.to;
  }else{
    var toD=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    var fromD=new Date(toD.getTime());
    var preset=_reportsPeriod.preset||'30d';
    if(preset==='7d')fromD.setDate(fromD.getDate()-6);
    else if(preset==='30d')fromD.setDate(fromD.getDate()-29);
    else if(preset==='month'){fromD=new Date(toD.getFullYear(),toD.getMonth(),1);}
    else if(preset==='year'){fromD=new Date(toD.getFullYear(),0,1);}
    else if(preset==='all'){fromD=new Date(2000,0,1);}
    from=dateToYmd(fromD);to=dateToYmd(toD);
  }
  return {from:from,to:to};
}
function setReportsPreset(preset){_reportsPeriod.preset=preset;_reportsPeriod.from='';_reportsPeriod.to='';renderReportsBody();}
function setReportsCustomDate(which,v){
  if(which==='from')_reportsPeriod.from=v||'';
  else _reportsPeriod.to=v||'';
  _reportsPeriod.preset='custom';
  renderReportsBody();
}

function renderReportsBody(){

    if(o.paid){paidCount++;revenue+=Number(o.paidAmount)||0;}
  });
  /* Загрузка пользователей. */
  var workByUser={};

  html+='<div><label>С даты</label><input type="date" value="'+esc(rg.from)+'" onchange="setReportsCustomDate(\'from\',this.value)"></div>';
  html+='<div><label>По дату</label><input type="date" value="'+esc(rg.to)+'" onchange="setReportsCustomDate(\'to\',this.value)"></div>';
  html+='</div>';

  html+='<div class="report-kpi-cell"><div class="num">'+orders.length+'</div><div class="lbl">Заказов</div></div>';
  html+='<div class="report-kpi-cell"><div class="num">'+itemsCount+'</div><div class="lbl">Позиций</div></div>';
  html+='<div class="report-kpi-cell"><div class="num">'+area.toFixed(2).replace('.',',')+'</div><div class="lbl">м² стекла</div></div>';
  html+='<div class="report-kpi-cell"><div class="num">'+numFmt(revenue)+' ₽</div><div class="lbl">Оплачено</div></div>';
  html+='</div>';
  html+='<div class="report-card"><div class="rc-title">Статусы</div>';
  Object.keys(STATUS_META).forEach(function(k){

/* ============ СИНХРОНИЗАЦИЯ С ЯНДЕКС.ДИСКОМ ============
   Вариант A: REST API Яндекс.Диска напрямую.
   Merge: last-write-wins на уровне сущностей по updatedAt + id.
   Файл: app:/Зерцало/sync.json (папка приложения).
   Токен: OAuth, хранится в localStorage (db.sync.token).
   ==================================================== */

/* === ВАРИАНТ A: предустановленный OAuth-токен ===
   При первом запуске на новом устройстве приложение автоматически
   подставляет этот токен и включает синхронизацию. Все устройства
   работают через один аккаунт Яндекс.Диска и общий файл sync.json.
   Если пользователь потом отключит синхронизацию — повторно НЕ подставляем. */
var AUTO_SYNC_TOKEN='y0__wgBEJbB-ZAJGPahTCCI8L-vGQ4oXYq-uXzb1xHY07ZRO5SueZVK';

var YANDEX_CLIENT_ID='';/* Пустая строка = пользователь подставит свой OAuth client_id в настройках. */
var YD_API='https://cloud-api.yandex.net/v1/disk';
var SYNC_FOLDER='Зерцало';
var SYNC_FILENAME='sync.json';
var SYNC_PATH='app:/'+SYNC_FOLDER+'/'+SYNC_FILENAME;

function syncEnsureDefaults(){
  if(!db.sync)db.sync={enabled:false,token:'',clientId:'',lastPushAt:0,lastPullAt:0,lastError:'',status:'off',deviceId:'',remoteRev:0,autoSetupDone:false};
  if(!db.sync.deviceId)db.sync.deviceId='dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
  /* === ВАРИАНТ A: авто-подстановка токена при первом запуске ===
     Срабатывает ровно один раз — на новом устройстве, где sync ещё не настроен.
     Если пользователь потом отключит синхронизацию через UI — повторно не активируем. */
  if(!db.sync.autoSetupDone){
    db.sync.autoSetupDone=true;
    if(!db.sync.token&&AUTO_SYNC_TOKEN){
      db.sync.token=AUTO_SYNC_TOKEN;
      db.sync.enabled=true;
      db.sync.status='idle';
      try{save();}catch(e){}
    }
  }
  if(!db.sync.status)db.sync.status=db.sync.enabled?'idle':'off';
  return db.sync;
}

async function ydRequest(method,path,opts){
  syncEnsureDefaults();
  var token=db.sync.token;
  if(!token)throw new Error('Нет токена Яндекс.Диска');
  opts=opts||{};
  var url=path.indexOf('http')===0?path:(YD_API+path);
  var init={method:method||'GET',headers:Object.assign({'Authorization':'OAuth '+token},opts.headers||{})};
  if(opts.body)init.body=opts.body;
  var resp=await fetch(url,init);
  if(!resp.ok){
    /* 404 при первом pull — норма (файла на Диске ещё нет). Если allow404 — вернём null. */
    if(resp.status===404&&opts.allow404)return null;
    var text='';
    try{text=await resp.text();}catch(e){}
    var msg='HTTP '+resp.status;
    try{var j=JSON.parse(text);if(j&&j.message)msg+=' — '+j.message;}catch(e){}
    if(resp.status===401)msg='401 — Токен недействителен или истёк';
    if(resp.status===403)msg='403 — Нет прав (проверьте scope cloud_api:disk.app_folder)';
    throw new Error(msg);
  }
  var ct=resp.headers.get('content-type')||'';
  if(ct.indexOf('application/json')>=0)return await resp.json();
  return await resp.text();
}
async function ydPing(){
  var r=await ydRequest('GET','/');
  return {user:r&&r.user?r.user.login:null,totalSpace:r&&r.total_space||0,usedSpace:r&&r.used_space||0};
}
async function ydEnsureFolder(){
  /* Папка в app:/ обычно уже существует; но попробуем создать — если 409 (exists) — ок. */
  try{
    await ydRequest('PUT','/resources?path='+encodeURIComponent('app:/'+SYNC_FOLDER));
    return true;
  }catch(e){
    if(String(e.message||'').indexOf('409')>=0)return true;
    /* Возможно папка app:/ уже есть — тогда не считаем ошибкой. */
    if(String(e.message||'').indexOf('already exists')>=0)return true;
    throw e;
  }
}
async function ydUpload(filename,text){
  var path='app:/'+SYNC_FOLDER+'/'+filename;
  var link=await ydRequest('GET','/resources/upload?overwrite=true&path='+encodeURIComponent(path));
  if(!link||!link.href)throw new Error('Не получен upload URL');
  var resp=await fetch(link.href,{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:text});
  if(!resp.ok)throw new Error('Upload HTTP '+resp.status);
  return true;
}
async function ydDownload(filename){
  var path='app:/'+SYNC_FOLDER+'/'+filename;
  var link;
  try{
    link=await ydRequest('GET','/resources/download?path='+encodeURIComponent(path),{allow404:true});
  }catch(e){
    /* Если 404 прилетел как исключение — трактуем как «файла нет», не роняем pull. */
    if(String(e.message||'').indexOf('404')>=0)return null;
    throw e;
  }
  if(!link||!link.href)return null;
  var resp=await fetch(link.href);
  if(resp.status===404)return null;
  if(!resp.ok)throw new Error('Download HTTP '+resp.status);
  return await resp.text();
}

/* === Сборка payload для синхронизации: только данные, без временных полей сессии. === */
function buildSyncPayload(){
  var payload={
    schemaVersion:SCHEMA_VERSION,
    exportedAt:Date.now(),
    deviceId:db.sync?db.sync.deviceId:'',
    orders:db.orders,
    items:db.items,
    users:db.users,
    clients:db.clients,
    addresses:db.addresses,
    events:db.events,
    contractors:db.contractors,
    routes:db.routes,
    notifications:db.notifications,
    roles:db.roles,
    settings:db.settings,
    trash:[],/* Корзину не синхронизируем — она локальная. */
    nextOrder:db.nextOrder,nextItem:db.nextItem,nextUser:db.nextUser,nextClient:db.nextClient,nextAddress:db.nextAddress,nextEvent:db.nextEvent,nextContractor:db.nextContractor,nextRoute:db.nextRoute,nextNotification:db.nextNotification
  };
  return payload;
}

/* === Merge входящего payload в db. LWW по updatedAt + id. === */
function mergeEntityArray(localArr,remoteArr,localById,idKey){
  idKey=idKey||'id';
  var result={};/* id -> объект. */
  (localArr||[]).forEach(function(o){if(o&&o[idKey]!=null)result[o[idKey]]={src:'local',obj:o};});
  (remoteArr||[]).forEach(function(ro){
    if(!ro||ro[idKey]==null)return;
    var lid=ro[idKey];
    var entry=result[lid];
    if(!entry){result[lid]={src:'remote',obj:ro};return;}
    var local=entry.obj,remote=ro;
    var lU=Number(local.updatedAt)||Number(local.createdAt)||0;
    var rU=Number(remote.updatedAt)||Number(remote.createdAt)||0;
    if(rU>lU)result[lid]={src:'remote',obj:remote};
    /* Иначе оставляем локальный. */
  });
  var out=[];
  Object.keys(result).forEach(function(k){
    var e=result[k];
    if(e.src==='local')out.push(e.obj);
    else{
      /* Применяем remote-объект: заменяем в локальном массиве или добавляем. */
      out.push(e.obj);
    }
  });
  return out;
}
function applyMergedArray(arrName,remoteArr,idKey){
  if(!Array.isArray(remoteArr))return;
  var merged=mergeEntityArray(db[arrName]||[],remoteArr,null,idKey||'id');
  db[arrName]=merged;
}
function applySyncPayload(remote){
  if(!remote||typeof remote!=='object')return;
  applyMergedArray('orders',remote.orders);
  applyMergedArray('items',remote.items);
  applyMergedArray('users',remote.users);
  applyMergedArray('clients',remote.clients);
  applyMergedArray('addresses',remote.addresses);
  applyMergedArray('events',remote.events);
  applyMergedArray('contractors',remote.contractors);
  applyMergedArray('routes',remote.routes);
  applyMergedArray('notifications',remote.notifications);
  /* Настройки — берём те, у которых updatedAt больше, а если его нет — по времени exportedAt. */
  if(remote.settings){
    var localS=Number(db.settings&&db.settings.updatedAt)||0;
    var remoteS=Number(remote.settings.updatedAt)||remote.exportedAt||0;
    if(remoteS>localS){db.settings=Object.assign({},db.settings,remote.settings);}
  }
  /* === РОЛИ: merge по ключам, а не «только если локально пусто» ===
     Для каждой роли:
       - если у нас её нет — берём из remote;
       - если у нас есть, а у remote новее (по updatedAt внутри объекта) — берём remote;
       - иначе оставляем локальную. Это не затирает настройки этого устройства,
         но подтягивает изменения, сделанные на других устройствах. */
  if(remote.roles&&typeof remote.roles==='object'){
    if(!db.roles||typeof db.roles!=='object')db.roles={};
    Object.keys(remote.roles).forEach(function(roleKey){
      var remoteRole=remote.roles[roleKey];
      if(!remoteRole||typeof remoteRole!=='object')return;
      var localRole=db.roles[roleKey];
      if(!localRole||typeof localRole!=='object'){db.roles[roleKey]=Object.assign({},remoteRole);return;}
      var lU=Number(localRole.updatedAt)||0;
      var rU=Number(remoteRole.updatedAt)||0;
      if(rU>lU)db.roles[roleKey]=Object.assign({},remoteRole);
    });
  }
  /* Счётчики next* — берём максимум из local и remote. */
  ['nextOrder','nextItem','nextUser','nextClient','nextAddress','nextEvent','nextContractor','nextRoute','nextNotification'].forEach(function(k){
    var lv=Number(db[k])||1,rv=Number(remote[k])||1;
    db[k]=Math.max(lv,rv);
  });
  /* Миграции для вновь добавленных записей. */
  (db.orders||[]).forEach(migrateOrder);
  (db.items||[]).forEach(migrateItem);
  (db.users||[]).forEach(migrateUser);
  (db.clients||[]).forEach(migrateClient);
  (db.addresses||[]).forEach(migrateAddress);
  (db.events||[]).forEach(migrateEvent);
  (db.contractors||[]).forEach(migrateContractor);
  (db.routes||[]).forEach(migrateRoute);
  (db.notifications||[]).forEach(migrateNotification);
  touchAllEntities();
}

async function yandexPull(){
  syncEnsureDefaults();
  if(!db.sync.token)throw new Error('Нет токена');
  var text=await ydDownload(SYNC_FILENAME);
  if(!text){return {ok:true,empty:true};}/* Файла ещё нет — это норма, не ошибка. */
  var remote=null;
  try{remote=JSON.parse(text);}catch(e){throw new Error('Файл повреждён (не JSON)');}
  applySyncPayload(remote);
  db.sync.lastPullAt=Date.now();
  if(remote&&remote.exportedAt)db.sync.remoteRev=remote.exportedAt;
  save();
  return {ok:true,merged:true};
}
async function yandexPush(){
  syncEnsureDefaults();
  if(!db.sync.token)throw new Error('Нет токена');
  await ydEnsureFolder();
  var payload=buildSyncPayload();
  await ydUpload(SYNC_FILENAME,JSON.stringify(payload));
  db.sync.lastPushAt=Date.now();
  save();
  return {ok:true};
}
async function syncNow(bothWays){
  syncEnsureDefaults();
  if(!db.sync.enabled){uiAlert('Синхронизация выключена');return;}
  if(!db.sync.token){uiAlert('Введите токен Яндекс.Диска в настройках');return;}
  if(!isOnline()){uiAlert('Нет интернета');return;}
  db.sync.status='syncing';updateSyncDot();
  try{
    if(bothWays!==false){
      await yandexPull();
    }
    await yandexPush();
    db.sync.status='idle';db.sync.lastError='';
    save();updateSyncDot();
    return {ok:true};
  }catch(e){
    db.sync.status='error';
    db.sync.lastError=String(e.message||e);
    save();updateSyncDot();
    throw e;
  }
}

/* === Дебаунс push. === */
var _pushTimer=null,_pushScheduled=false;
function schedulePush(){
  if(!db.sync||!db.sync.enabled||!db.sync.token)return;
  if(!isOnline())return;
  _pushScheduled=true;
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(function(){
    _pushScheduled=false;
    yandexPush().then(function(){updateSyncDot();}).catch(function(e){db.sync.status='error';db.sync.lastError=String(e.message||e);updateSyncDot();});
  },5000);
}
/* === Дебаунс pull — не чаще раза в 60 сек. === */
var _pullTimer=null;
function schedulePull(){
  if(!db.sync||!db.sync.enabled||!db.sync.token)return;
  if(!isOnline())return;
  var now=Date.now();
  var last=db.sync.lastPullAt||0;
  if(now-last<60000)return;
  clearTimeout(_pullTimer);
  _pullTimer=setTimeout(function(){
    yandexPull().then(function(){updateSyncDot();render();}).catch(function(e){db.sync.status='error';db.sync.lastError=String(e.message||e);updateSyncDot();});
  },800);
}
function initSyncWatcher(){
  if(window._syncWatcherBound)return;window._syncWatcherBound=true;
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible')schedulePull();
  });
  window.addEventListener('focus',function(){schedulePull();});
}

/* Расчёт ориентировочной стоимости заказа. */
function computeOrderPrice(o,items){
  if(!db.settings||!db.settings.prices)return null;
  var p=db.settings.prices;
  var hasAny=(p.mirrorM2||p.glassM2||p.edgeM||p.electroEach);
  if(!hasAny)return null;
  var total=0,areaM=0,areaG=0,edge=0,elec=0;
  items.forEach(function(i){
    var a=calcArea(i)*i.qty;
    if(i.type==='MIRROR')areaM+=a;else areaG+=a;
    edge+=calcPerim(i)*i.qty;
    if(hasElectric(i))elec+=i.qty;
  });
  total=areaM*(p.mirrorM2||0)+areaG*(p.glassM2||0)+edge*(p.edgeM||0)+elec*(p.electroEach||0);
  return {total:Math.round(total),areaM:areaM,areaG:areaG,edge:edge,elec:elec};
}

  ok('mergeEntityArray LWW',(function(){
    var loc=[{id:1,v:'L',updatedAt:100}];
    var rem=[{id:1,v:'R',updatedAt:200}];
    var out=mergeEntityArray(loc,rem);
    return out.length===1&&out[0].v==='R';
  })());
  ok('computeOrderPrice без прайса → null',(function(){var s=db.settings.prices;db.settings.prices={};var r=computeOrderPrice({},[]);db.settings.prices=s;return r===null;})());
  ok('AUTO_SYNC_TOKEN задан',typeof AUTO_SYNC_TOKEN==='string'&&AUTO_SYNC_TOKEN.length>10);
  return r;
}
function runSelfTests(){
  var results=selfTests(),passed=results.filter(function(r){return r.pass;}).length,total=results.length;
  var html='<h2>🧪 Самотесты</h2><div style="font-size:13px;color:#8894a9;margin-bottom:12px">Пройдено: <b style="color:'+(passed===total?'#2c7a54':'#c14d4d')+'">'+passed+' / '+total+'</b></div>';
  html+='<div class="test-results">'+results.map(function(r){return '<div class="'+(r.pass?'test-pass':'test-fail')+'">'+(r.pass?'✓':'✗')+' '+esc(r.name)+(r.extra?' — '+esc(r.extra):'')+'</div>';}).join('')+'</div>';
  html+='<button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>';
  showModal(html);
}

boot();
</script>
