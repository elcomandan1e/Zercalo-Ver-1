<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6f8fc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Зерцало">
<title>Зерцало — Замеры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<link id="appManifest" rel="manifest">
<style>
:root{color-scheme:light;--font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:"PT Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;--bg-1:#f6f8fc;--bg-2:#eef3fa;--cloud-1:rgba(184,209,247,0.45);--cloud-2:rgba(222,213,250,0.40);--cloud-3:rgba(196,231,248,0.45);--accent:#5b7fb8;--accent-deep:#3b5c8f;--accent-soft:#eaf1fb;--accent-line:#d6e2f3;--text:#2a3547;--text-soft:#5a6780;--muted:#8894a9;--muted-2:#aab4c5;--line:#e8eef7;--line-soft:#f0f4fa;--surface:#ffffff;--ok:#4caf7d;--ok-soft:#e6f4ec;--warn:#d9924a;--warn-soft:#fdf3e6;--danger:#c96565;--danger-soft:#fcedec;--r-card:24px;--r-btn:16px;--r-input:14px;--r-pill:999px;--sh-sm:0 2px 10px rgba(90,120,170,0.07);--sh-md:0 8px 28px rgba(90,120,170,0.09);--sh-lg:0 16px 48px rgba(90,120,170,0.13);--sh-accent:0 8px 22px rgba(91,127,184,0.28);--t-fast:0.16s ease;--t:0.24s cubic-bezier(.4,0,.2,1);--logo-blue:#1e4d7b;--logo-ring:#1e4d7b;--logo-bg:#e6f1fb;--logo-bg-inner:#f5fafe;--font-tech:"PT Sans Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;--tech-ink:#1a2733;--tech-line:#3b5c8f;--tech-dim:#c14d4d;--tech-accent:#3d86c8}
:root[data-theme="dark"]{color-scheme:dark;--bg-1:#141a24;--bg-2:#101621;--cloud-1:rgba(80,120,190,0.14);--cloud-2:rgba(120,100,180,0.12);--cloud-3:rgba(70,130,190,0.14);--accent:#7ba0dd;--accent-deep:#a8c3eb;--accent-soft:rgba(123,160,221,0.14);--accent-line:rgba(123,160,221,0.28);--text:#e6ecf5;--text-soft:#b6c2d4;--muted:#8a97ac;--muted-2:#606b80;--line:#232c3b;--line-soft:#1b2230;--surface:#1c2431;--ok:#4ec38c;--ok-soft:rgba(78,195,140,0.15);--warn:#e0a866;--warn-soft:rgba(224,168,102,0.14);--danger:#e08080;--danger-soft:rgba(224,128,128,0.14);--sh-sm:0 2px 10px rgba(0,0,0,0.35);--sh-md:0 8px 28px rgba(0,0,0,0.4);--sh-lg:0 16px 48px rgba(0,0,0,0.55);--sh-accent:0 8px 22px rgba(123,160,221,0.25);--logo-blue:#a8c3eb;--logo-ring:#7ba0dd;--logo-bg:#252f42;--logo-bg-inner:#2f3b52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;font-family:var(--font-sans);color:var(--text);font-size:16px;line-height:1.45;background:var(--bg-1);background-attachment:fixed;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
html[data-theme] body{background-image:radial-gradient(ellipse 60% 40% at 15% 5%,var(--cloud-1),transparent 60%),radial-gradient(ellipse 55% 45% at 90% 15%,var(--cloud-2),transparent 65%),radial-gradient(ellipse 70% 50% at 50% 100%,var(--cloud-3),transparent 70%),linear-gradient(180deg,var(--bg-1),var(--bg-2))}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,0.75);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgba(255,255,255,0.8);box-shadow:0 2px 12px rgba(90,120,170,0.06)}
html[data-theme="dark"] header{background:rgba(20,26,36,0.92);border-bottom-color:rgba(123,160,221,0.15)}
header button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-deep);border:none;border-radius:14px;font-size:20px;font-weight:600;cursor:pointer;flex-shrink:0;transition:background var(--t-fast),transform var(--t-fast)}
header button:active{transform:scale(0.94);background:var(--accent-line)}
.header-logo{flex:1;display:flex;align-items:center;min-width:0;padding-left:2px}
.header-logo svg{height:40px;max-width:100%}
.header-user{display:none;flex-direction:column;align-items:flex-end;justify-content:center;font-size:11px;line-height:1.25;max-width:120px;min-width:0;padding:4px 10px;background:var(--accent-soft);border-radius:12px;cursor:pointer}
.header-user.visible{display:flex}
.header-user .hu-name{font-weight:700;font-size:12px;color:var(--accent-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.header-user .hu-role{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.container{padding:16px 16px 0;max-width:720px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--surface);border-radius:var(--r-card);padding:18px 20px 18px 24px;margin-bottom:14px;box-shadow:var(--sh-sm);border:1px solid rgba(255,255,255,0.9);cursor:pointer;transition:transform var(--t),box-shadow var(--t);position:relative;overflow:hidden}
.card:active{transform:scale(0.985);box-shadow:var(--sh-md)}
.card.no-tap{cursor:default}.card.no-tap:active{transform:none}
.card::before{content:'';position:absolute;left:8px;top:14px;bottom:14px;width:4px;border-radius:4px;background:transparent}
.card.t-MIRROR::before{background:#3b5c8f}.card.t-SHOWER::before{background:#3a7a5a}.card.t-APRON::before{background:#a05c26}.card.t-SHELF::before{background:#6a4b9a}.card.t-PANNO::before{background:#9d3668}
.card.stagger{opacity:0;animation:fadeInUp .34s cubic-bezier(.2,.7,.3,1) forwards}
.card-title{font-weight:600;font-size:17px;margin-bottom:6px;color:var(--text);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.card-sub{color:var(--muted);font-size:13.5px;line-height:1.5}
.type-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-pill);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.type-MIRROR{background:#eaf1fb;color:#3b5c8f}.type-SHOWER{background:#e8f4ee;color:#3a7a5a}.type-APRON{background:#fcefe0;color:#a05c26}.type-SHELF{background:#f0ebf8;color:#6a4b9a}.type-PANNO{background:#fbe9f2;color:#9d3668}
.frame-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px 7px 9px;border-radius:var(--r-pill);background:var(--accent-soft);border:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-soft);flex-shrink:0;font-family:inherit}
.frame-chip.active{background:var(--accent);color:#fff}
.frame-swatch{display:inline-block;width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(0,0,0,.08)}
.summary{background:linear-gradient(135deg,#7b9dd1 0%,#5b7fb8 60%,#4a6ba5 100%);color:#fff;border-radius:var(--r-card);padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh-accent);position:relative;overflow:hidden}
.summary .line{font-size:14px;opacity:.95;font-weight:500}
.summary .breakdown{font-size:12.5px;opacity:.85;margin-top:8px;line-height:1.6}
.btn{display:block;width:100%;padding:15px 20px;border:none;border-radius:var(--r-btn);font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;font-family:inherit;text-align:center;position:relative;overflow:hidden}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;box-shadow:var(--sh-accent)}
.btn-secondary{background:var(--accent-soft);color:var(--accent-deep)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-tg{background:linear-gradient(135deg,#4fb5e6,#229ED9);color:#fff}
.btn-wa{background:linear-gradient(135deg,#4ede85,#25D366);color:#fff}
.btn-email{background:linear-gradient(135deg,#ee6b5f,#EA4335);color:#fff}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;border:none;border-radius:var(--r-pill);padding:16px 26px;font-size:15px;font-weight:600;font-family:inherit;box-shadow:var(--sh-accent);cursor:pointer;z-index:50;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s ease}
.fab:active{transform:scale(0.94)}
.fab.fab-hidden{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}
.fab.fab-always{transform:none!important;opacity:1!important;pointer-events:auto!important}
input,textarea,select{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-input);font-size:16px;font-family:inherit;margin-top:6px;background:var(--surface);color:var(--text);-webkit-appearance:none}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,127,184,0.10)}
textarea{resize:vertical;min-height:76px}
label{display:block;margin-top:14px;font-size:13px;color:var(--text-soft);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0;margin-top:6px;flex-wrap:wrap;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 16px;border-radius:var(--r-pill);background:var(--accent-soft);border:none;white-space:nowrap;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--text-soft);flex-shrink:0;font-family:inherit;position:relative;overflow:hidden}
.chip.active{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;box-shadow:0 4px 12px rgba(91,127,184,0.3)}
.chip.chip-multi.active{background:linear-gradient(135deg,#4fb5e6,#229ED9)}
.sort-chips{margin-bottom:10px;flex-wrap:nowrap;overflow-x:auto}
.sort-chip{padding:7px 12px;font-size:12.5px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:8px}
.type-btn{padding:18px 12px;border-radius:var(--r-input);border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:inherit}
.type-btn .ico{font-size:26px;line-height:1}
.type-btn.active{border-color:var(--accent);background:linear-gradient(180deg,var(--surface),var(--accent-soft));color:var(--accent-deep)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.section-title{font-size:12px;font-weight:700;color:var(--accent-deep);margin-top:30px;padding-bottom:10px;text-transform:uppercase;letter-spacing:0.8px;background:linear-gradient(90deg,transparent,var(--accent-line) 20%,var(--accent-line) 80%,transparent) bottom/100% 1px no-repeat}
.section-title:first-of-type{margin-top:14px}
.checkbox-row{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 16px;background:var(--accent-soft);border-radius:var(--r-input);border:1.5px solid transparent}
.checkbox-row.electric-row{background:var(--warn-soft);border-color:#f2d9b8}
.checkbox-row.niche-row{background:linear-gradient(135deg,rgba(160,120,220,0.14),rgba(160,120,220,0.06));border-color:rgba(160,120,220,0.28)}
.checkbox-row input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:52px;height:32px;margin:0;flex-shrink:0;border-radius:999px;background:#d0d7e2;position:relative;cursor:pointer;border:none}
html[data-theme="dark"] .checkbox-row input[type="checkbox"]{background:#3a4459}
.checkbox-row input[type="checkbox"]::before{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .24s cubic-bezier(.4,0,.2,1)}
html[data-theme="dark"] .checkbox-row input[type="checkbox"]::before{background:#e6ecf5}
.checkbox-row input[type="checkbox"]:checked{background:linear-gradient(135deg,#7b9dd1,#5b7fb8)}
.checkbox-row input[type="checkbox"]:checked::before{transform:translateX(20px)}
.checkbox-row label{margin:0;font-size:14.5px;color:var(--text);font-weight:600;cursor:pointer}
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(50,70,100,0.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn var(--t) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes pageFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{position:absolute;border-radius:50%;pointer-events:none;width:24px;height:24px;background:rgba(91,127,184,0.35);transform:translate(-50%,-50%) scale(0);animation:ripple .6s ease-out forwards}
.modal{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:720px;max-height:94vh;overflow-y:auto;padding:22px 20px 40px;box-shadow:0 -8px 40px rgba(50,70,100,0.15);animation:slideUp var(--t) both;-webkit-overflow-scrolling:touch;position:relative}
.modal h2{margin:0 0 10px;font-size:21px;display:flex;align-items:center;gap:12px;font-weight:700;color:var(--text)}
.modal-crumbs{font-size:11.5px;color:var(--muted);margin-bottom:10px;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.modal-crumbs .bc-sep{color:var(--muted-2)}.modal-crumbs .bc-cur{color:var(--accent-deep)}
.modal-sec-nav{position:sticky;top:0;z-index:9;display:flex;gap:6px;overflow-x:auto;padding:10px 20px;margin:6px -20px 14px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.modal-sec-chip{padding:7px 14px;border-radius:999px;background:var(--accent-soft);color:var(--text-soft);border:none;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;cursor:pointer;font-family:inherit}
.modal-sec-chip.active{background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff}
#__dialogOverlay{position:fixed;inset:0;z-index:600;background:rgba(50,70,100,0.32);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s both}
#__dialogOverlay .dialog-box{background:var(--surface);border-radius:24px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:var(--sh-lg);animation:slideUp 0.22s both}
#__dialogOverlay .dialog-box h2{margin:0 0 8px;font-size:19px;font-weight:700}
.calc-box{background:linear-gradient(180deg,rgba(255,255,255,0.5),var(--accent-soft));border-radius:var(--r-card);padding:16px 18px;margin-top:20px;font-size:14px;line-height:1.5;color:var(--text-soft);border:1px solid var(--accent-line)}
.calc-box .calc-title{display:block;font-weight:700;font-size:15px;color:var(--accent-deep);margin-bottom:10px}
.calc-box .calc-row{padding:3px 0;line-height:1.5}
.calc-box .calc-row b{color:var(--accent-deep);font-weight:700}
.calc-box .calc-elec{margin-top:10px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(255,215,0,0.22),rgba(255,200,0,0.08));border:1.5px solid rgba(230,190,40,0.55);color:#7a5a0c;font-weight:600;line-height:1.5}
.electric-banner{background:linear-gradient(135deg,rgba(255,215,0,0.22),rgba(255,200,0,0.08));border:1.5px solid rgba(230,190,40,0.55);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:13px;color:#7a5a0c;font-weight:600}
.skew-block{margin-top:14px;padding:14px;background:linear-gradient(180deg,rgba(220,38,38,0.06),rgba(220,38,38,0.02));border:1.5px solid rgba(220,38,38,0.28);border-radius:14px}
.mirror-ref-corner{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:180px;margin-top:6px}
.ref-corner-btn{width:100%;aspect-ratio:1;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:26px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.ref-corner-btn.active{background:linear-gradient(135deg,#dc2626,#c14d4d);border-color:#c14d4d;color:#fff}
.item-card{display:flex;align-items:center;gap:14px}
.item-card .info{flex:1;min-width:0}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:15px;line-height:1.6}
.empty-logo{display:flex;justify-content:center;margin-bottom:24px}
.empty-logo svg{max-width:300px;width:78%;height:auto}
.del-x{background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;padding:6px 10px;border-radius:10px;font-weight:600;font-family:inherit}
.info-line{display:flex;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line-soft)}
.info-line:last-child{border-bottom:none}
.info-line .lbl{color:var(--muted);min-width:110px;flex-shrink:0;font-weight:500}
.info-line .val{color:var(--text);font-weight:500;word-break:break-word}
.tap-link{color:var(--accent-deep);text-decoration:none;font-weight:600;cursor:pointer}
.paid-badge,.unpaid-badge,.photo-badge,.photo-count,.role-badge{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700}
.paid-badge{background:var(--ok-soft);color:#2c7a54}
.unpaid-badge{background:var(--danger-soft);color:var(--danger)}
.photo-badge,.photo-count{background:var(--accent-soft);color:var(--accent-deep);margin-left:6px}
.role-badge{background:var(--accent-soft);color:var(--accent-deep)}
.role-badge.role-admin{background:#fdf3e6;color:#a05c26}
.role-badge.role-manager{background:#eaf1fb;color:#3b5c8f}
.role-badge.role-master{background:#e8f4ee;color:#3a7a5a}
.role-badge.role-surveyor{background:#f0ebf8;color:#6a4b9a}
.corner-badge{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.corner-badge.paid{background:var(--ok-soft);color:#2c7a54}
.corner-badge.unpaid{background:var(--danger-soft);color:var(--danger)}
.draw-section{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.draw-section h3{font-size:15px;margin:0 0 6px;color:var(--accent-deep);font-weight:700}
.tech-draw-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
.tech-draw-wrap canvas{display:block;width:100%;height:auto}
.tech-toolbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tech-toolbar button{flex:1;min-width:110px;padding:10px 12px;border-radius:12px;border:none;background:var(--accent-soft);color:var(--accent-deep);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.tech-toolbar button:active{transform:scale(0.97)}
.photo-section{margin-top:20px;padding:16px;background:var(--accent-soft);border-radius:var(--r-card)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin:10px 0}
.photo-thumb-wrap{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface)}
.photo-thumb{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.photo-del{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(50,70,100,0.75);color:#fff;border:none;font-size:13px;cursor:pointer}
.photo-strip{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.photo-strip-item{width:64px;height:64px;border-radius:14px;object-fit:cover;border:1.5px solid var(--line);flex-shrink:0;cursor:pointer}
.thumb-aspect{width:80px;height:auto;min-height:60px;max-height:120px;border-radius:14px;border:1.5px solid var(--line);object-fit:contain;background:#fff;cursor:pointer;flex-shrink:0}
.order-num{display:inline-block;background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;padding:3px 12px;border-radius:10px;font-size:11.5px;font-weight:700;margin-right:10px;font-family:var(--font-mono)}
.order-num-lg{display:inline-block;background:linear-gradient(135deg,#7b9dd1,#5b7fb8);color:#fff;padding:10px 22px;border-radius:16px;font-size:22px;font-weight:700;font-family:var(--font-mono)}
.order-date-lg{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:14px}

function drawTechIso(ctx,x,y,w,h,d){

  ctx.save();ctx.strokeStyle='#e8eef7';ctx.lineWidth=1;ctx.strokeRect(x-4,y-4,w+8,h+8);
  var cx=x+w/2,cy=y+h/2;
  if(d.type==='SHOWER'){
    var pl=buildShowerPanels(d);if(!pl.length){ctx.fillStyle='#98a2b3';ctx.font='400 18px Arial';ctx.textAlign='center';ctx.fillText('—',cx,cy);ctx.restore();return;}
    var xs=[],ys=[];pl.forEach(function(p){xs.push(p.x1,p.x2);ys.push(p.y1,p.y2);});
    var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
    var projW=Math.max(1,maxX-minX),projH=Math.max(1,maxY-minY);
    var sc=Math.min((w-80)/projW,(h-60)/projH);var offX=cx-projW*sc/2-minX*sc,offY=cy-projH*sc/2-minY*sc;
    pl.forEach(function(p){var a={x:offX+p.x1*sc,y:offY+p.y1*sc},b={x:offX+p.x2*sc,y:offY+p.y2*sc};var isD=p.role==='D';
      ctx.strokeStyle=isD?'#c95a1e':'#3d86c8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.fillStyle=blue;ctx.font='700 12px "PT Sans Narrow",Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('№'+(p.panelIndex+1),a.x+(b.x-a.x)*0.5,a.y+(b.y-a.y)*0.5-8);});
    for(var i=1;i<pl.length;i++){var prev=pl[i-1],cur=pl[i];
      var dx1=prev.x2-prev.x1,dy1=prev.y2-prev.y1,l1=Math.hypot(dx1,dy1)||1;dx1/=l1;dy1/=l1;
      var dx2=cur.x2-cur.x1,dy2=cur.y2-cur.y1,l2=Math.hypot(dx2,dy2)||1;dx2/=l2;dy2/=l2;
      var cosA=dx1*dx2+dy1*dy2;var ang=Math.round(Math.acos(Math.max(-1,Math.min(1,cosA)))*180/Math.PI);
      var vx=offX+cur.x1*sc,vy=offY+cur.y1*sc;
      ctx.fillStyle=red;ctx.font='700 12px "PT Sans Narrow",Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(ang+'°',vx+16,vy+16);}
    var minPx=offX+minX*sc,maxPx=offX+maxX*sc,maxPy=offY+maxY*sc,minPy=offY+minY*sc;
    ctx.strokeStyle=red;ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(minPx,maxPy+22);ctx.lineTo(maxPx,maxPy+22);ctx.stroke();
    ctx.beginPath();ctx.moveTo(minPx-22,minPy);ctx.lineTo(minPx-22,maxPy);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=red;ctx.font='700 14px "PT Sans Narrow",Arial';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(numFmt(Math.round(projW*10)/10)+' см',(minPx+maxPx)/2,maxPy+28);
    ctx.save();ctx.translate(minPx-30,(minPy+maxPy)/2);ctx.rotate(-Math.PI/2);ctx.textBaseline='middle';ctx.fillText(numFmt(Math.round(projH*10)/10)+' см',0,0);ctx.restore();
  }else if(d.type==='APRON'){
    var secs=Array.isArray(d.apronSections)?d.apronSections:[];if(!secs.length){ctx.fillStyle='#98a2b3';ctx.font='400 18px Arial';ctx.textAlign='center';ctx.fillText('—',cx,cy);ctx.restore();return;}
    var angles=apronSectionAngles(d);var cxA=0,cyA=0,hd=0,pts=[{x:0,y:0}];
    secs.forEach(function(s,i){var b=Number(s.bottom)||0;var a=i===0?0:angles[i];hd+=a;var rad=hd*Math.PI/180;cxA+=Math.cos(rad)*b;cyA+=Math.sin(rad)*b;pts.push({x:cxA,y:cyA});});
    var pxs=pts.map(function(p){return p.x;}),pys=pts.map(function(p){return p.y;});
    var minXp=Math.min.apply(null,pxs),maxXp=Math.max.apply(null,pxs),minYp=Math.min.apply(null,pys),maxYp=Math.max.apply(null,pys);

    var scp=Math.min((w-80)/projWp,(h-60)/projHp);var offXp=cx-projWp*scp/2-minXp*scp,offYp=cy-projHp*scp/2-minYp*scp;

    ctx.fillText('Вид сверху: '+numFmt(gd.w)+' см × '+numFmt(d.th||4)+' мм',cx,cy-pxH/2-10);
  }
  ctx.restore();
}

function openPrintPreview(){var o=db.orders.find(function(x){return x.id===currentOrderId;});if(!o){uiAlert('Заказ не найден');return;}var items=itemsOf(o.id),model=buildReceiptModel(o,items),html=receiptToHTML(model),w=window.open('','_blank');if(!w){uiAlert('Разрешите всплывающие окна');return;}w.document.open();w.document.write(html);w.document.close();}
